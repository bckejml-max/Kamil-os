name: OS1047 Control Operations QA
on:
  pull_request:
    paths:
      - 'js/controlOperations1047.js'
      - 'js/controlOperations1047Boot.js'
      - 'js/controlPlane1037.js'
      - 'js/bettingBootstrap543.js'
      - 'scripts/control_operations_1047_guard.mjs'
      - 'e2e_control_operations_1047.spec.mjs'
      - '.github/workflows/os1047-control-operations.yml'
  push:
    branches: [main]
    paths:
      - 'js/controlOperations1047.js'
      - 'js/controlOperations1047Boot.js'
      - 'js/bettingBootstrap543.js'
      - 'scripts/control_operations_1047_guard.mjs'
      - '.github/workflows/os1047-control-operations.yml'
  workflow_dispatch:
jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OS1038-1047 contracts
        run: node scripts/control_operations_1047_guard.mjs
      - name: Control Plane compatibility
        run: |
          node scripts/control_plane_1037_guard.mjs
          node scripts/legacy_cleanup_987_guard.mjs
          node scripts/one_os_977_guard.mjs
          node scripts/one_os_967_guard.mjs
          node scripts/visual_rebuild_947_guard.mjs
      - name: Install browser QA
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: OS1047 browser smoke
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kamil-os1047-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx playwright test e2e_control_operations_1047.spec.mjs e2e_control_plane_1037.spec.mjs e2e_os947_visual.spec.mjs --reporter=line
