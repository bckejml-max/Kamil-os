name: Kamil OS Control Plane QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'os-canonical.css'
      - 'js/instantShell64.js'
      - 'js/app.js'
      - 'js/viewRegistry.js'
      - 'js/viewRuntime41.js'
      - 'js/diagnostics.js'
      - 'js/todayPage2000.js'
      - 'js/actionTruthEngine.js'
      - 'js/runtimeOwnership1100.js'
      - 'js/runtimeHealth1120.js'
      - 'js/runtimeLeak1210.js'
      - 'js/performanceBudget1220.js'
      - 'js/viewLifecycle1230.js'
      - 'os2000_guard.mjs'
      - 'os2020_guard.mjs'
      - 'runtime_boot_guard.mjs'
      - 'runtime_ownership_1100_guard.mjs'
      - 'runtime_inventory_1100_guard.mjs'
      - 'scripts/control_plane_1037_guard.mjs'
      - 'scripts/control_operations_1047_guard.mjs'
      - 'scripts/legacy_cleanup_987_guard.mjs'
      - 'scripts/qa-suites.mjs'
      - 'scripts/run-qa-suite.mjs'
      - 'package.json'
      - '.github/workflows/os1047-control-operations.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'os-canonical.css'
      - 'js/instantShell64.js'
      - 'js/app.js'
      - 'js/viewRegistry.js'
      - 'js/viewRuntime41.js'
      - 'js/diagnostics.js'
      - 'js/todayPage2000.js'
      - 'js/actionTruthEngine.js'
      - 'js/runtimeOwnership1100.js'
      - 'js/runtimeHealth1120.js'
      - 'js/runtimeLeak1210.js'
      - 'js/performanceBudget1220.js'
      - 'js/viewLifecycle1230.js'
      - 'os2000_guard.mjs'
      - 'os2020_guard.mjs'
      - 'runtime_boot_guard.mjs'
      - 'runtime_ownership_1100_guard.mjs'
      - 'runtime_inventory_1100_guard.mjs'
      - 'scripts/control_plane_1037_guard.mjs'
      - 'scripts/control_operations_1047_guard.mjs'
      - 'scripts/legacy_cleanup_987_guard.mjs'
      - 'scripts/qa-suites.mjs'
      - 'scripts/run-qa-suite.mjs'
      - 'package.json'
      - '.github/workflows/os1047-control-operations.yml'
  workflow_dispatch:

concurrency:
  group: control-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Control-plane syntax
        run: |
          node --check js/instantShell64.js
          node --check js/app.js
          node --check js/viewRegistry.js
          node --check js/viewRuntime41.js
          node --check js/diagnostics.js
          node --check js/todayPage2000.js
          node --check js/actionTruthEngine.js
          node --check js/runtimeOwnership1100.js
          node --check js/runtimeHealth1120.js
          node --check js/runtimeLeak1210.js
          node --check js/performanceBudget1220.js
          node --check js/viewLifecycle1230.js

      - name: Control-plane contracts
        run: |
          node os2000_guard.mjs
          node os2020_guard.mjs
          node runtime_boot_guard.mjs
          node runtime_ownership_1100_guard.mjs
          node runtime_inventory_1100_guard.mjs
          node scripts/control_plane_1037_guard.mjs
          node scripts/control_operations_1047_guard.mjs
          node scripts/legacy_cleanup_987_guard.mjs
