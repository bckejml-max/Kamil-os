name: Kamil OS Control Plane + Operations QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'os2.css'
      - 'os2010.css'
      - 'os2020.css'
      - 'js/instantShell64.js'
      - 'js/app.js'
      - 'js/viewRuntime41.js'
      - 'js/todayPage2000.js'
      - 'js/decisionFocus2020.js'
      - 'js/runtimeOwnership1100.js'
      - 'js/runtimeHealth1120.js'
      - 'js/runtimeLeak1210.js'
      - 'js/performanceBudget1220.js'
      - 'js/viewLifecycle1230.js'
      - 'js/bettingPage527.js'
      - 'js/bettingBootstrap543.js'
      - 'js/ticketPage100.js'
      - 'os2000_guard.mjs'
      - 'os2020_guard.mjs'
      - 'runtime_boot_guard.mjs'
      - 'runtime_ownership_1100_guard.mjs'
      - 'runtime_inventory_1100_guard.mjs'
      - 'e2e_os2000_redesign.spec.mjs'
      - 'e2e_os2020_decision_focus.spec.mjs'
      - 'e2e_os347_critical_path.spec.mjs'
      - '.github/workflows/os1047-control-operations.yml'
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OS 2.0 runtime syntax
        run: |
          node --check js/instantShell64.js
          node --check js/app.js
          node --check js/viewRuntime41.js
          node --check js/todayPage2000.js
          node --check js/decisionFocus2020.js
          node --check js/runtimeOwnership1100.js
          node --check js/runtimeHealth1120.js
          node --check js/runtimeLeak1210.js
          node --check js/performanceBudget1220.js
          node --check js/viewLifecycle1230.js
          node --check js/bettingPage527.js
          node --check js/bettingBootstrap543.js
          node --check js/ticketPage100.js
          node --check os2000_guard.mjs
          node --check os2020_guard.mjs
          node --check runtime_boot_guard.mjs
          node --check runtime_ownership_1100_guard.mjs
          node --check runtime_inventory_1100_guard.mjs
          node --check e2e_os2000_redesign.spec.mjs
          node --check e2e_os2020_decision_focus.spec.mjs
          node --check e2e_os347_critical_path.spec.mjs
      - name: OS 2.0 runtime contracts
        run: |
          node os2000_guard.mjs
          node os2020_guard.mjs
          node runtime_boot_guard.mjs
          node runtime_ownership_1100_guard.mjs
          node runtime_inventory_1100_guard.mjs
      - name: Canonical compatibility
        run: npm run test:release
      - name: Install browser QA
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: OS 2.0 browser smoke
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kamil-control-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx playwright test e2e_os2000_redesign.spec.mjs e2e_os2020_decision_focus.spec.mjs e2e_os347_critical_path.spec.mjs --reporter=line --workers=1
