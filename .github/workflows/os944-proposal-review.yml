name: OS944 Proposal Review QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/proposal_review_944_guard.mjs
      - run: node scripts/autonomous_943_guard.mjs
      - run: node scripts/self_improving_892_guard.mjs
      - run: node scripts/copilot_842_guard.mjs
