name: Kamil OS 193 Release QA
on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: OS 193 static and syntax QA
        run: node qa.mjs

      - name: Deployment and core hardening
        run: |
          node vercel_policy_test.mjs
          node core_hardening_31_test.mjs

      - name: Cloud write and sync safety
        run: |
          node trust_sync_32_static_test.mjs
          node copilot_write_32_test.mjs

      - name: Decision safety and delta regression
        run: |
          node decision_next_30_test.mjs
          node decision_next_30_integration_test.mjs
          node decision_delta_30_test.mjs
          node decision_delta_30_integration_test.mjs

      - name: Ticket data integrity 182
        run: node ticket_import_integrity_182_test.mjs

      - name: Ticket import report 183
        run: node ticket_import_report_183_test.mjs

      - name: Ticket import rollback 184
        run: node ticket_import_rollback_184_test.mjs

      - name: Ticket Recovery Center 185
        run: node ticket_recovery_185_test.mjs

      - name: Ticket Cloud Recovery Vault 186
        run: node ticket_recovery_cloud_186_test.mjs

      - name: Ticket Recovery Cloud UX 187
        run: node ticket_recovery_ux_187_test.mjs

      - name: Ticket First-open Cloud Hydration 188
        run: node ticket_recovery_hydration_188_test.mjs

      - name: Ticket Recovery Snapshot Diff 189
        run: node ticket_recovery_diff_189_test.mjs

      - name: Ticket Multi-market Desk 190
        run: node ticket_market_desk_190_test.mjs

      - name: Ticket Market Coverage Queue 191
        run: node ticket_market_queue_191_test.mjs

      - name: Ticket Net Payout Learning 192
        run: node ticket_payout_learning_192_test.mjs

      - name: Ticket Minimum Profit Floor 193
        run: node ticket_profit_floor_193_test.mjs

      - name: Ticket market API contract
        run: node ticket_market_api_65_6_test.mjs

      - name: Current runtime syntax belt
        run: |
          node --check js/instantShell64.js
          node --check js/app.js
          node --check js/viewRuntime41.js
          node --check js/todayPage101.js
          node --check js/ticketPage100.js
          node --check js/ticketPage665.js
          node --check js/moneyPage100.js
          node --check js/os181Suite.js
          node --check js/executiveCommand164.js
          node --check js/dataTrust163.js
          node --check js/ticketImportIntegrity182.js
          node --check js/ticketImportReport183.js
          node --check js/ticketImportRollback184.js
          node --check js/ticketRecovery185.js
          node --check js/ticketRecoveryCloudModel186.js
          node --check js/ticketRecoveryCloud186.js
          node --check js/ticketRecoveryUx187.js
          node --check js/ticketRecoveryHydration188.js
          node --check js/ticketRecoveryDiffModel189.js
          node --check js/ticketRecoveryDiff189.js
          node --check js/ticketMarketDeskModel190.js
          node --check js/ticketMarketDesk190.js
          node --check js/ticketMarketQueueModel191.js
          node --check js/ticketMarketQueue191.js
          node --check js/ticketPayoutLearningModel192.js
          node --check js/ticketPayoutLearning192.js
          node --check js/ticketProfitFloorModel193.js
          node --check js/ticketProfitFloor193.js
          node --check js/ticketImport660.js
          node --check js/ticketCloud660.js
          node --check js/ticketSales150.js
          node --check js/ticketSaleDetail151.js

      - name: Install browser QA
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: OS 193 browser release smoke
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kamil-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx playwright test e2e_os181_current_smoke.spec.mjs --reporter=line
