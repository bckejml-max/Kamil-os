name: Kamil OS Ticket Data Readiness QA

on:
  pull_request:
    paths:
      - 'js/ticket*.js'
      - 'js/state.js'
      - 'js/cloud.js'
      - 'js/config.js'
      - 'js/utils.js'
      - 'js/dataIntegrity1130.js'
      - 'js/runtimeOwnership1100.js'
      - 'js/dataSourceRegistry.js'
      - 'ticket*.mjs'
      - 'qa.mjs'
      - 'package.json'
      - '.github/workflows/qa.yml'
  push:
    branches: [main]
    paths:
      - 'js/ticket*.js'
      - 'js/state.js'
      - 'js/cloud.js'
      - 'js/config.js'
      - 'js/utils.js'
      - 'js/dataIntegrity1130.js'
      - 'js/runtimeOwnership1100.js'
      - 'js/dataSourceRegistry.js'
      - 'ticket*.mjs'
      - 'qa.mjs'
      - 'package.json'
      - '.github/workflows/qa.yml'
  workflow_dispatch:

concurrency:
  group: ticket-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ticket-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ticket release QA
        run: node qa.mjs

      - name: Deployment, cloud and decision safety
        run: |
          node vercel_policy_test.mjs
          node core_hardening_31_test.mjs
          node trust_sync_32_static_test.mjs
          node copilot_write_32_test.mjs
          node decision_next_30_test.mjs
          node decision_next_30_integration_test.mjs
          node decision_delta_30_test.mjs
          node decision_delta_30_integration_test.mjs

      - name: Ticket data and recovery contracts
        run: |
          node ticket_import_integrity_182_test.mjs
          node ticket_import_report_183_test.mjs
          node ticket_import_rollback_184_test.mjs
          node ticket_recovery_185_test.mjs
          node ticket_recovery_cloud_186_test.mjs
          node ticket_recovery_ux_187_test.mjs
          node ticket_recovery_hydration_188_test.mjs
          node ticket_recovery_diff_189_test.mjs
          node ticket_market_desk_190_test.mjs
          node ticket_market_queue_191_test.mjs

      - name: Ticket economics and execution contracts
        run: |
          node ticket_payout_learning_192_test.mjs
          node ticket_profit_floor_193_test.mjs
          node ticket_repricing_guard_194_test.mjs
          node ticket_sell_ladder_195_test.mjs
          node ticket_commander_196_test.mjs
          node ticket_daily_queue_197_test.mjs
          node ticket_opportunity_198_test.mjs
          node ticket_presale_radar_199_test.mjs
          node ticket_presale_execution_200_test.mjs
          node ticket_exposure_201_test.mjs
          node ticket_risk_budget_202_test.mjs
          node ticket_capital_allocator_203_test.mjs
          node ticket_portfolio_planner_204_test.mjs
          node ticket_learned_net_planner_205_test.mjs
          node ticket_profit_confidence_206_test.mjs
          node ticket_risk_adjusted_ranking_207_test.mjs
          node ticket_commander_208_test.mjs
          node ticket_action_priority_209_test.mjs
          node ticket_buy_blocker_215_test.mjs
          node ticket_presale_execution_wiring_216_test.mjs
          node ticket_data_readiness_217_test.mjs
          node ticket_market_api_65_6_test.mjs
