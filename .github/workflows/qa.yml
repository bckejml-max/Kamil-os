name: Kamil OS 183 Release QA
on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: OS 183 static and syntax QA
        run: node qa.mjs

      - name: Deployment and core hardening
        run: |
          node vercel_policy_test.mjs
          node core_hardening_31_test.mjs

      - name: Cloud write and sync safety
        run: |
          node trust_sync_32_static_test.mjs
          node copilot_write_32_test.mjs

      - name: Decision safety and delta regression
        run: |
          node decision_next_30_test.mjs
          node decision_next_30_integration_test.mjs
          node decision_delta_30_test.mjs
          node decision_delta_30_integration_test.mjs

      - name: Ticket data integrity 182
        run: node ticket_import_integrity_182_test.mjs

      - name: Ticket import report 183
        run: node ticket_import_report_183_test.mjs

      - name: Ticket market API contract
        run: node ticket_market_api_65_6_test.mjs

      - name: Current runtime syntax belt
        run: |
          node --check js/instantShell64.js
          node --check js/app.js
          node --check js/viewRuntime41.js
          node --check js/todayPage101.js
          node --check js/ticketPage100.js
          node --check js/moneyPage100.js
          node --check js/os181Suite.js
          node --check js/executiveCommand164.js
          node --check js/dataTrust163.js
          node --check js/ticketImportIntegrity182.js
          node --check js/ticketImportReport183.js
          node --check js/ticketImport660.js
          node --check js/ticketCloud660.js
          node --check js/ticketSales150.js
          node --check js/ticketSaleDetail151.js

      - name: Install browser QA
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: OS 183 browser release smoke
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kamil-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx playwright test e2e_os181_current_smoke.spec.mjs --reporter=line
