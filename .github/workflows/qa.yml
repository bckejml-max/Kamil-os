name: Kamil OS QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static QA
        run: node qa.mjs
      - name: Integration QA
        run: node integration.mjs
      - name: Ticket event aggregation
        run: node ticket_events_test.mjs
      - name: Ticket lessons
        run: node ticket_lessons_test.mjs
      - name: Ticket learning engine
        run: node ticket_learning_test.mjs
      - name: Cashflow 90 days
        run: node cashflow90_test.mjs
      - name: Capital Allocation
        run: node capital_allocation_test.mjs
      - name: Action Plan
        run: node action_plan_test.mjs
      - name: Director OS
        run: node director_os_test.mjs
      - name: Delegation Center
        run: node delegation_center_test.mjs
      - name: Project Health
        run: node project_health_test.mjs
      - name: Release gate
        run: node release_gate.mjs
