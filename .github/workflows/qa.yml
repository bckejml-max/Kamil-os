name: Kamil OS QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static QA
        run: node qa.mjs
      - name: Integration QA
        run: node integration.mjs
      - name: Ticket event aggregation
        run: node ticket_events_test.mjs
      - name: Ticket lessons
        run: node ticket_lessons_test.mjs
      - name: Ticket learning engine
        run: node ticket_learning_test.mjs
      - name: Cashflow 90 days
        run: node cashflow90_test.mjs
      - name: Capital Allocation
        run: node capital_allocation_test.mjs
      - name: Action Plan
        run: node action_plan_test.mjs
      - name: Director OS
        run: node director_os_test.mjs
      - name: Delegation Center
        run: node delegation_center_test.mjs
      - name: Project Health
        run: node project_health_test.mjs
      - name: Project Money
        run: node project_money_test.mjs
      - name: Project Money static
        run: node project_money_static_test.mjs
      - name: Personal Admin
        run: node personal_admin_test.mjs
      - name: Personal Admin static
        run: node personal_admin_static_test.mjs
      - name: Insurance Center
        run: node insurance_center_test.mjs
      - name: Insurance Center static
        run: node insurance_static_test.mjs
      - name: Household Bills
        run: node household_bills_test.mjs
      - name: Household Bills static
        run: node household_bills_static_test.mjs
      - name: Documents & Expiry
        run: node documents_expiry_test.mjs
      - name: Documents & Expiry static
        run: node documents_expiry_static_test.mjs
      - name: Family & Home
        run: node family_home_test.mjs
      - name: Family & Home static
        run: node family_home_static_test.mjs
      - name: Personal Risk Center
        run: node personal_risk_test.mjs
      - name: Personal Risk Center static
        run: node personal_risk_static_test.mjs
      - name: Release gate
        run: node release_gate.mjs
