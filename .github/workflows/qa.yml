name: Kamil OS QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static QA
        run: node qa.mjs
      - name: Personal Plus 29 static hardening
        run: node personal_plus_29_static_test.mjs
      - name: Personal Autopilot integration
        run: node integration.mjs
      - name: Personal OS invariants
        run: node personal_os_26_test.mjs
      - name: Personal Autopilot 28 base
        run: node autopilot28_test.mjs
      - name: Personal Autopilot 29 complete
        run: node personal_plus_29_test.mjs
      - name: Sensitive Vault 29
        run: node vault_29_test.mjs
      - name: Scenario Lab 12 months
        run: node scenario_lab_28_test.mjs
      - name: Smlouvy k prověření
        run: node renewal_radar_test.mjs
      - name: Legacy Scenario Simulator engine
        run: node scenario_simulator_test.mjs
      - name: Emergency File
        run: node emergency_file_test.mjs
      - name: Backup & Recovery Guard
        run: node backup_guard_test.mjs
      - name: Ticket event aggregation
        run: node ticket_events_test.mjs
      - name: Ticket lessons
        run: node ticket_lessons_test.mjs
      - name: Ticket learning engine
        run: node ticket_learning_test.mjs
      - name: Cashflow 90 days
        run: node cashflow90_test.mjs
      - name: Capital Allocation
        run: node capital_allocation_test.mjs
      - name: Action Plan
        run: node action_plan_test.mjs
      - name: Personal Admin engine
        run: node personal_admin_test.mjs
      - name: Insurance Center engine
        run: node insurance_center_test.mjs
      - name: Household Bills engine
        run: node household_bills_test.mjs
      - name: Documents & Expiry engine
        run: node documents_expiry_test.mjs
      - name: Family & Home engine
        run: node family_home_test.mjs
      - name: Personal Risk Center engine
        run: node personal_risk_test.mjs
      - name: Release gate
        run: node release_gate.mjs
