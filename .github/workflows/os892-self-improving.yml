name: OS892 Self-Improving QA
on:
  pull_request:
    paths:
      - 'js/selfImproving892.js'
      - 'js/usage892.js'
      - 'js/commandCopilot840.js'
      - 'self_improving_892_guard.mjs'
      - 'copilot_842_guard.mjs'
      - 'copilot_841_guard.mjs'
      - 'copilot_840_guard.mjs'
      - '.github/workflows/os892-self-improving.yml'
  push:
    branches: [main]
    paths:
      - 'js/selfImproving892.js'
      - 'js/usage892.js'
      - 'js/commandCopilot840.js'
      - 'self_improving_892_guard.mjs'
      - 'copilot_842_guard.mjs'
      - 'copilot_841_guard.mjs'
      - 'copilot_840_guard.mjs'
      - '.github/workflows/os892-self-improving.yml'
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node self_improving_892_guard.mjs
      - run: node copilot_842_guard.mjs
      - run: node copilot_841_guard.mjs
      - run: node copilot_840_guard.mjs
      - run: node strategy_command_790_guard.mjs
