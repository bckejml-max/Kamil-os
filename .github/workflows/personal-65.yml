name: Kamil OS 181 Personal + Ticket Regression
on:
  pull_request:
  push:
    branches: [main]

jobs:
  personal-ticket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check current personal + ticket runtime
        run: |
          node --check js/instantShell64.js
          node --check js/personalAssistant650.js
          node --check js/personalShell640.js
          node --check js/personalHardening650.js
          node --check js/personalToday640.js
          node --check js/personalWaiting650.js
          node --check js/ticketCloud660.js
          node --check js/ticketImport660.js
          node --check js/ticketCommander660.js
          node --check js/ticketPage100.js
          node --check js/ticketSales150.js
          node --check js/ticketSaleDetail151.js
          node --check js/ticketSettlement153.js
          node --check js/ticketPayout154.js
          node --check js/ticketAccounting155.js
          node --check js/ticketDecisionSafety149.js
          node --check js/ticketSafetyUi149.js
          node --check js/os181Suite.js
          node --check api/ticket-market-watch.js
      - name: Current Personal + Ticket architecture assertions
        run: |
          grep -q "optionalImport('./personalShell640.js'" js/instantShell64.js
          grep -q "optionalImport('./personalHardening650.js'" js/instantShell64.js
          grep -q "from('ticket_inventory')" js/ticketCloud660.js
          grep -q "PAYOUT_RECEIVED" js/ticketCloud660.js
          grep -q "enhanceTicketSales150" js/ticketPage100.js
          grep -q "enhanceTicketSettlement153" js/ticketPage100.js
          grep -q "enhanceTicketAccounting155" js/ticketPage100.js
          grep -q "enhanceTickets181" js/ticketPage100.js
          grep -q "ticket_price_journal" js/os181Suite.js
          grep -q "payout_received_czk" js/ticketSettlement153.js
          ! grep -Eiq "service[_-]?role" js/ticketCloud660.js
      - name: Ticket Intelligence API parser
        run: node ticket_market_api_65_6_test.mjs
      - name: Core cloud safety
        run: |
          node core_hardening_31_test.mjs
          node trust_sync_32_static_test.mjs
          node copilot_write_32_test.mjs
      - name: Decision safety regression
        run: |
          node decision_next_30_test.mjs
          node decision_next_30_integration_test.mjs
