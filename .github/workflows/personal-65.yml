name: Kamil OS 65 Personal Release
on:
  pull_request:
  push:
    branches: [main]
jobs:
  personal65:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check personal 65 modules
        run: |
          node --check js/personalAssistant650.js
          node --check js/personalToday640.js
          node --check js/personalWaiting650.js
          node --check js/personalAsk640.js
          node --check js/personalShell640.js
          node --check js/personalFamily640.js
          node --check js/personalHome640.js
          node --check js/personalMoney640.js
          node --check js/personalDocuments640.js
          node --check js/personalMore640.js
          node --check js/personalHardening650.js
          node --check js/personalUsage650.js
      - name: Personal 65 static release assertions
        run: node personal_65_static_test.mjs
      - name: Core cloud safety
        run: |
          node core_hardening_31_test.mjs
          node trust_sync_32_static_test.mjs
          node copilot_write_32_test.mjs
      - name: Install browser QA
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E 65
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kamil-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx playwright test e2e_daily_personal_assistant_65_0.spec.mjs --reporter=line
