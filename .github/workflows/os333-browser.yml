name: Kamil OS Canonical Release + Browser QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: canonical-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked test dependency
        run: npm ci

      - name: Canonical release contract
        run: npm run test:release

      - name: Ticket renderer ownership
        run: node ticket_flicker_338_test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static app
        run: |
          python3 -m http.server 4173 > /tmp/kamil-os-http.log 2>&1 &
          echo $! > /tmp/kamil-os-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/kamil-os-http.log
          exit 1

      - name: Critical-path performance gate
        run: npx playwright test e2e_os347_critical_path.spec.mjs --reporter=line --workers=1

      - name: Full canonical browser suite
        run: npm run test:e2e -- --workers=1
