name: OS333 Chromium Smoke

on:
  push:
    branches: [main, feat/os348-retire-workspaces305]
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependency
        run: npm install
      - name: Canonical domain syntax
        run: |
          node --check js/domainOS328.js
          node --check js/focusRadar334.js
          node --check js/focusQueue335.js
          node --check js/actionExecution336.js
          node --check js/ticketDesk331.js
          node --check js/ticketOnDemand346.js
          node --check js/managerOS341.js
          node --check js/navigationOS342.js
          node --check js/navigation302.js
          node --check js/ticketPage100.js
          node --check js/personalShell640.js
          node --check js/workspaces305.js
          node --check js/instantShell64.js
          node --check e2e_os343_boot_budget.spec.mjs
          node --check e2e_os344_lazy_shell.spec.mjs
          node --check e2e_os345_deferred_boot.spec.mjs
          node --check e2e_os346_ticket_on_demand.spec.mjs
          node --check e2e_os347_critical_path.spec.mjs
          node --check e2e_os348_workspace_retirement.spec.mjs
      - name: OS333+ release guard
        run: npm run test:release
      - name: OS338 ticket renderer ownership
        run: node ticket_flicker_338_test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static app
        run: |
          python3 -m http.server 4173 > /tmp/kamil-os-http.log 2>&1 &
          echo $! > /tmp/kamil-os-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/kamil-os-http.log
          exit 1
      - name: OS333 through OS348 browser smoke
        run: npx playwright test e2e_os333_unified_command.spec.mjs e2e_os334_focus_radar.spec.mjs e2e_os335_focus_queue.spec.mjs e2e_os336_action_execution.spec.mjs e2e_os339_ticket_stability.spec.mjs e2e_os340_ticket_portfolio.spec.mjs e2e_os341_manager.spec.mjs e2e_os342_navigation.spec.mjs e2e_os343_boot_budget.spec.mjs e2e_os344_lazy_shell.spec.mjs e2e_os345_deferred_boot.spec.mjs e2e_os346_ticket_on_demand.spec.mjs e2e_os347_critical_path.spec.mjs e2e_os348_workspace_retirement.spec.mjs --reporter=line
