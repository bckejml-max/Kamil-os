name: Kamil OS 278 Mega Release QA
on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa278:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OS229-278 mega regression
        run: node mega_278_test.mjs
      - name: Syntax
        run: |
          node --check js/uxFoundation238.js
          node --check js/dailyCommander248.js
          node --check js/financeCommand258.js
          node --check js/ticketCommand268.js
          node --check js/managerAutopilot278.js
          node --check js/instantShell64.js
      - name: Existing workspace regressions
        run: |
          node app_workspace_211_test.mjs
          node compact_navigation_212_test.mjs
      - name: Install browser QA
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: OS278 browser mega-release smoke
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kamil-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx playwright test e2e_os278_megarelease.spec.mjs --reporter=line
