name: Kamil OS 300 Operator Cleanup + Safety QA
on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa300:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OS229-278 preserved regression
        run: node mega_278_test.mjs
      - name: OS279-300 operator regression
        run: node mega_298_test.mjs
      - name: Settled-only payout learning regression
        run: node ticket_payout_learning_192_test.mjs
      - name: Compliance freshness regression
        run: node ticket_opportunity_198_test.mjs
      - name: UX Foundation compatibility regression
        run: node ux_foundation_238_test.mjs
      - name: Production chrome regression
        run: node production_chrome_228_test.mjs
      - name: Syntax
        run: |
          node --check js/productionChrome228.js
          node --check js/uxFoundation238.js
          node --check js/dailyCommander248.js
          node --check js/financeCommand258.js
          node --check js/ticketCommand268.js
          node --check js/managerAutopilot278.js
          node --check js/lifeOperator298.js
          node --check js/operatorHome299.js
          node --check js/ticketPayoutLearningModel192.js
          node --check js/ticketOpportunityModel198.js
          node --check js/personalShell640.js
          node --check js/instantShell64.js
      - name: Existing workspace regressions
        run: |
          node app_workspace_211_test.mjs
          node compact_navigation_212_test.mjs
      - name: Install browser QA
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: OS300 browser operator smoke
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kamil-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx playwright test e2e_os298_operator.spec.mjs e2e_os278_megarelease.spec.mjs e2e_os238_ux_foundation.spec.mjs e2e_os228_production_chrome.spec.mjs --reporter=line
