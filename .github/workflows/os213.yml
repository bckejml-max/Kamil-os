name: Kamil OS 228 Production Chrome QA
on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa228:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve Today wake regression
        run: node today_dashboard_213_test.mjs
      - name: Preserve authless regression
        run: node authless_227_test.mjs
      - name: Production chrome regression 228
        run: node production_chrome_228_test.mjs
      - name: Syntax
        run: |
          node --check js/todayDashboard213.js
          node --check js/todayWake226.js
          node --check js/personalActionExecution641.js
          node --check js/appWorkspace211.js
          node --check js/instantShell64.js
      - name: Existing workspace regressions
        run: |
          node app_workspace_211_test.mjs
          node compact_navigation_212_test.mjs
      - name: Install browser QA
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: OS 228 browser production chrome smoke
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kamil-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx playwright test e2e_os228_production_chrome.spec.mjs --reporter=line
