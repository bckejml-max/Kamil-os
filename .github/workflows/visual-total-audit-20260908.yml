name: Visual Total Audit 2026-09-08

on:
  push:
    branches: [audit/visual-total-20260908]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture live production visual audit
        env:
          KAMIL_AUDIT_URL: https://kamil-os-smoke.vercel.app/
        run: npx playwright test e2e_visual_total_audit_20260908.spec.mjs --workers=1 --reporter=line
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-total-audit-${{ github.run_id }}
          path: visual-audit-output
          retention-days: 7
