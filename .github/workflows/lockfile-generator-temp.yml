name: TEMP Lockfile Generator

on:
  push:
    branches: [fix/release-hardening-20260908]
  workflow_dispatch:

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit lockfile
        run: |
          echo '---PACKAGE_LOCK_BEGIN---'
          cat package-lock.json
          echo '---PACKAGE_LOCK_END---'
