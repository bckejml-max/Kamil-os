name: OS946 Preview PR Builder QA
on:
  pull_request:
    paths:
      - 'js/previewPr946.js'
      - 'js/safeChangePlan945.js'
      - 'scripts/preview_pr_946_guard.mjs'
      - 'scripts/safe_change_plan_945_guard.mjs'
      - 'scripts/proposal_review_944_guard.mjs'
      - 'autonomous_943_guard.mjs'
      - 'self_improving_892_guard.mjs'
      - 'copilot_842_guard.mjs'
      - '.github/workflows/os946-preview-pr.yml'
  push:
    branches: [main]
    paths:
      - 'js/previewPr946.js'
      - 'js/safeChangePlan945.js'
      - 'scripts/preview_pr_946_guard.mjs'
      - 'scripts/safe_change_plan_945_guard.mjs'
      - 'scripts/proposal_review_944_guard.mjs'
      - 'autonomous_943_guard.mjs'
      - 'self_improving_892_guard.mjs'
      - 'copilot_842_guard.mjs'
      - '.github/workflows/os946-preview-pr.yml'
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/preview_pr_946_guard.mjs
      - run: node scripts/safe_change_plan_945_guard.mjs
      - run: node scripts/proposal_review_944_guard.mjs
      - run: node autonomous_943_guard.mjs
      - run: node self_improving_892_guard.mjs
      - run: node copilot_842_guard.mjs
