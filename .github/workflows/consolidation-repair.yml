name: Kamil OS Consolidation QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'consolidation.css'
      - 'js/viewRegistry.js'
      - 'js/commandRouter.js'
      - 'js/consolidationRuntime.js'
      - 'js/runtimeManifest.js'
      - 'js/instantShell64.js'
      - 'js/viewRuntime41.js'
      - 'js/todayPage101.js'
      - 'js/ticketPage100.js'
      - 'js/moneyPage100.js'
      - 'js/familyPage140.js'
      - 'js/homePage140.js'
      - 'js/bettingPage527.js'
      - 'js/bettingBootstrap543.js'
      - 'js/searchIndex.js'
      - 'js/featureStorage.js'
      - 'js/controlOperations1047.js'
      - 'js/lifecycle.js'
      - 'js/uiState.js'
      - 'js/stateContracts.js'
      - 'js/sourceRegistry.js'
      - 'js/ticketMarketAdapter.js'
      - 'js/utils.js'
      - 'js/documentsPage141.js'
      - 'js/releaseMeta.js'
      - 'scripts/consolidation_guard.mjs'
      - 'scripts/production_canary.mjs'
      - 'scripts/control_operations_1047_guard.mjs'
      - 'scripts/control_plane_1037_guard.mjs'
      - 'scripts/legacy_cleanup_987_guard.mjs'
      - 'scripts/one_os_977_guard.mjs'
      - 'scripts/one_os_967_guard.mjs'
      - 'e2e_consolidation.spec.mjs'
      - 'e2e_control_operations_1047.spec.mjs'
      - '.github/workflows/consolidation-repair.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'consolidation.css'
      - 'js/**'
      - 'scripts/consolidation_guard.mjs'
      - 'scripts/production_canary.mjs'
      - 'e2e_consolidation.spec.mjs'
      - 'e2e_control_operations_1047.spec.mjs'
      - '.github/workflows/consolidation-repair.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consolidation architecture guard
        run: node scripts/consolidation_guard.mjs
      - name: Safety and compatibility guards
        run: |
          node scripts/control_operations_1047_guard.mjs
          node scripts/control_plane_1037_guard.mjs
          node scripts/legacy_cleanup_987_guard.mjs
          node scripts/one_os_977_guard.mjs
          node scripts/one_os_967_guard.mjs
          node scripts/visual_rebuild_947_guard.mjs
      - name: Install browser QA
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Consolidation browser QA
        id: browser
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kamil-consolidation-http.log 2>&1 &
          SERVER_PID=$!
          set +e
          npx playwright test e2e_consolidation.spec.mjs e2e_control_operations_1047.spec.mjs e2e_control_plane_1037.spec.mjs --reporter=json > consolidation-playwright.json
          CODE=$?
          kill $SERVER_PID || true
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidation-browser-report
          path: |
            consolidation-playwright.json
            test-results/consolidation-*.png
          if-no-files-found: warn
      - name: Browser QA gate
        if: steps.browser.outputs.code != '0'
        run: exit 1

  production-canary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed production build
        env:
          KAMIL_OS_URL: https://kamil-os-smoke.vercel.app
          CANARY_ATTEMPTS: 48
          CANARY_DELAY_MS: 5000
        run: node scripts/production_canary.mjs
