name: OS1061 Provider Ledger Repair
on:
  push:
    branches: [fix/provider-health-ledger-20260908]
    paths:
      - '.github/workflows/os1061-provider-ledger-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-health-ledger-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply OS1061 repairs
        shell: bash
        run: |
          node <<'NODE'
          import fs from 'node:fs';

          const replace=(file,from,to)=>{
            let text=fs.readFileSync(file,'utf8');
            if(!text.includes(from))throw new Error(`${file}: expected source block not found`);
            text=text.replace(from,to);
            fs.writeFileSync(file,text);
          };
          const replaceRe=(file,re,to)=>{
            let text=fs.readFileSync(file,'utf8');
            if(!re.test(text))throw new Error(`${file}: expected regex block not found`);
            text=text.replace(re,to);
            fs.writeFileSync(file,text);
          };

          replace('api/core70-health.js',
          `async function pulseHealth(key){
           if(!key)return{configured:false,ok:false,status:null,authMode:null,message:'PULSESCORE_NOT_CONFIGURED'};
           if(Date.now()-Number(pulseHealthCache.checkedAt||0)<PULSE_HEALTH_TTL_MS&&pulseHealthCache.ok!==null)return{configured:true,...pulseHealthCache};
           return{configured:true,ok:true,status:null,authMode:null,message:null};
          }`,
          `async function pulseHealth(key){
           if(!key)return{configured:false,verified:false,ok:false,status:null,authMode:null,message:'PULSESCORE_NOT_CONFIGURED'};
           if(Date.now()-Number(pulseHealthCache.checkedAt||0)<PULSE_HEALTH_TTL_MS&&pulseHealthCache.ok!==null)return{configured:true,verified:true,...pulseHealthCache};
           return{configured:true,verified:false,ok:false,status:null,authMode:null,message:'PULSESCORE_UNVERIFIED'};
          }`);

          replace('api/core70-health.js',
          `return json(res,200,{ok:true,version:'70.13-candidate-scope',checks:{runtime_endpoint:true,viagogo_api:viagogo,gmail_api:gmail,pulsescore_api:pulse.ok===true,pulsescore_configured:!!pulseKey,pulsescore_status:pulse.status,pulsescore_auth_mode:pulse.authMode,football_data_poisson_model:true,api_football_key:apiFootball,fmd_api_key:fmd},pulse:{ok:pulse.ok,status:pulse.status,authMode:pulse.authMode,message:pulse.message},ledger:ledgerSummary()});`,
          `return json(res,200,{ok:true,version:'70.14-truthful-provider-health',checks:{runtime_endpoint:true,viagogo_api:viagogo,gmail_api:gmail,pulsescore_api:pulse.ok===true,pulsescore_configured:!!pulseKey,pulsescore_verified:pulse.verified===true,pulsescore_status:pulse.status,pulsescore_auth_mode:pulse.authMode,football_data_poisson_model:true,api_football_key:apiFootball,fmd_api_key:fmd},pulse:{configured:!!pulseKey,verified:pulse.verified===true,ok:pulse.ok,status:pulse.status,authMode:pulse.authMode,message:pulse.message},ledger:ledgerSummary()});`);

          replace('js/bettingOddsFeed693.js',
          `const HEALTH='/api/market-history?source=chance_odds_health693';`,
          `const HEALTH='/api/market-history?source=chance_odds_health693';\nconst FALLBACK_HEALTH='/api/core70-health';`);
          replace('js/bettingOddsFeed693.js',
          `let provider={checkedAt:0,configured:false,ready:false,checking:null};`,
          `let provider={checkedAt:0,configured:false,ready:false,fallbackConfigured:false,fallbackVerified:false,fallbackReady:false,fallbackStatus:null,fallbackMessage:null,checking:null};`);
          replaceRe('js/bettingOddsFeed693.js',/async function checkProvider\(force=false\)\{[\s\S]*?\n\}\nfunction managed/,
          `async function checkProvider(force=false){
           if(!force&&Date.now()-provider.checkedAt<5*60000)return provider;
           if(provider.checking)return provider.checking;
           provider.checking=(async()=>{
            try{
             const [primaryRes,fallbackRes]=await Promise.all([
              originalFetch(\`${HEALTH}&_=\${Date.now()}\`,{cache:'no-store',headers:{Accept:'application/json'}}).catch(()=>null),
              originalFetch(\`${FALLBACK_HEALTH}?_=\${Date.now()}\`,{cache:'no-store',headers:{Accept:'application/json'}}).catch(()=>null)
             ]);
             const primary=primaryRes?await primaryRes.json().catch(()=>null):null;
             const fallback=fallbackRes?await fallbackRes.json().catch(()=>null):null;
             const fallbackStatus=Number(fallback?.checks?.pulsescore_status||fallback?.pulse?.status||0)||null;
             provider={
              checkedAt:Date.now(),
              configured:primary?.configured===true,
              ready:primaryRes?.ok===true&&primary?.ready===true,
              provider:primary?.provider||'odds-api.io',
              bookmaker:primary?.bookmaker||'Chance.cz',
              fallbackConfigured:fallback?.checks?.pulsescore_configured===true,
              fallbackVerified:fallback?.checks?.pulsescore_verified===true||fallback?.pulse?.verified===true,
              fallbackReady:fallback?.checks?.pulsescore_api===true,
              fallbackStatus,
              fallbackMessage:fallback?.pulse?.message||null,
              checking:null
             };
             if(provider.ready)resetPulseStop();
            }catch{
             provider={checkedAt:Date.now(),configured:false,ready:false,fallbackConfigured:false,fallbackVerified:false,fallbackReady:false,fallbackStatus:null,fallbackMessage:null,checking:null};
            }
            publish();return provider;
           })();
           return provider.checking;
          }
          function managed`);
          replaceRe('js/bettingOddsFeed693.js',/function publish\(\)\{[\s\S]*?\n\}\nexport async function installBettingOddsFeed693/,
          `function publish(){
           window.__KAMIL_ODDS_FEED693__={version:VERSION,...provider,at:Date.now()};
           const root=document.querySelector('#bettingView');if(!root)return;
           let box=root.querySelector('[data-bet693]');
           if(!box){box=document.createElement('section');box.dataset.bet693='1';box.style.cssText='padding:10px 12px;border:1px solid rgba(135,164,194,.14);border-radius:10px;background:rgba(7,19,31,.55);font-size:11px;color:#91a7ba';const anchor=root.querySelector('.bet144-metrics');anchor?.insertAdjacentElement('afterend',box)}
           if(!box)return;
           if(provider.ready)box.innerHTML='<b style="color:#8fe0ad">🟢 Chance feed 693</b> · Odds-API.io aktivní · PulseScore pouze fallback';
           else if(provider.fallbackStatus===429)box.innerHTML='<b style="color:#f28c8c">🔴 Chance feed nedostupný</b> · PulseScore BASIC kvóta vyčerpaná · čekám na nový limit nebo primární provider';
           else if(provider.fallbackReady)box.innerHTML='<b style="color:#8fe0ad">🟢 Chance fallback aktivní</b> · PulseScore ověřený · Odds-API.io není nakonfigurovaný';
           else if(provider.fallbackConfigured&&!provider.fallbackVerified)box.innerHTML='<b style="color:#f0c979">🟠 Chance fallback neověřený</b> · PulseScore je nakonfigurovaný, ale health ho bez reálného skenu už neoznačuje falešně zeleně';
           else if(provider.fallbackConfigured)box.innerHTML='<b style="color:#f28c8c">🔴 Chance fallback není dostupný</b> · primární Odds-API.io není nakonfigurovaný';
           else box.innerHTML='<b style="color:#f28c8c">🔴 Chance feed není nakonfigurovaný</b> · chybí primární i fallback serverový provider';
          }
          export async function installBettingOddsFeed693`);

          replace('js/bettingLedger543.js',
          `const API='/api/betting-ledger543';\nconst STORE='kamil_betting_ledger_543';\nconst CONFIRMED542='kamil_betting_confirmed_542';\nconst VERSION='543.1.0';`,
          `import {store} from './state.js';\n\nconst API='/api/betting-ledger543';\nconst LEGACY_STORE='kamil_betting_ledger_543';\nconst CONFIRMED542='kamil_betting_confirmed_542';\nconst VERSION='543.2.0';`);
          replaceRe('js/bettingLedger543.js',/function read\(\)\{[\s\S]*?\nfunction betId/,
          `function legacyRead(){try{return JSON.parse(localStorage.getItem(LEGACY_STORE)||'{}')}catch{return{}}}
          function ledgerShape(v){return{bets:Array.isArray(v?.bets)?v.bets:[],bankrollCzk:Number(v?.bankrollCzk||0),unitCzk:Number(v?.unitCzk||0),updatedAt:v?.updatedAt||null}}
          function read(){const canonical=ledgerShape(store.get()?.bettingLedger),legacy=ledgerShape(legacyRead());return{bets:merge(legacy.bets,canonical.bets),bankrollCzk:canonical.bankrollCzk||legacy.bankrollCzk||0,unitCzk:canonical.unitCzk||legacy.unitCzk||0,updatedAt:canonical.updatedAt||legacy.updatedAt||null}}
          function write(state,{cloud=true}={}){const next={...ledgerShape(state),updatedAt:new Date().toISOString()};store.mutate('Aktualizována historie sázek',s=>{s.bettingLedger=next},{undo:false,cloud,audit:false});try{localStorage.setItem(LEGACY_STORE,JSON.stringify(next))}catch{}window.dispatchEvent(new CustomEvent('kamil:betting-ledger543-updated',{detail:{bets:next.bets.length,bankrollCzk:next.bankrollCzk,unitCzk:next.unitCzk,at:Date.now()}}));return next}
          function betId`);
          replace('js/bettingLedger543.js',`let storageMode='client_fallback',serverWritable=false;`,`let storageMode='os_state',serverWritable=false;`);
          replaceRe('js/bettingLedger543.js',/async function hydrate\(\)\{[\s\S]*?\nfunction panelHtml/,
          `async function hydrate(){const hadCanonical=!!store.get()?.bettingLedger,hadLegacy=!!localStorage.getItem(LEGACY_STORE)||!!localStorage.getItem(CONFIRMED542);let state=migrate542(read());const remote=await apiGet();if(remote?.ok){serverWritable=remote.writable===true;storageMode=serverWritable?(remote.storage||'kv'):'os_state';state.bets=merge(remote.bets,state.bets);if(!state.bankrollCzk)state.bankrollCzk=Number(remote.bankrollCzk||0);if(!state.unitCzk)state.unitCzk=Number(remote.unitCzk||0)}write(state,{cloud:!hadCanonical&&hadLegacy});syncRender()}
          function panelHtml`);
          replace('js/bettingLedger543.js',
          `serverWritable?'✓ Serverový ledger je zapisovatelný.':'Lokální persistentní režim: data přežijí refresh na tomto zařízení; serverové KV zatím není připojeno.'`,
          `serverWritable?'✓ Serverový ledger je zapisovatelný.':'Historie je součástí hlavního stavu Kamil OS; při připojeném Cloudu se synchronizuje spolu s OS. Serverové KV zůstává volitelné.'`);

          replace('js/state.js',
          ` ticketBook:{items:[],watchlist:[],history:[],review:[]},\n debtBook:{items:[],review:[]},`,
          ` ticketBook:{items:[],watchlist:[],history:[],review:[]},\n bettingLedger:{bets:[],bankrollCzk:0,unitCzk:0,updatedAt:null},\n debtBook:{items:[],review:[]},`);
          replace('js/state.js',
          ` s.ticketBook=s.ticketBook||{items:[],watchlist:[],history:[],review:[]};s.ticketBook.items=Array.isArray(s.ticketBook.items)?s.ticketBook.items:[];s.ticketBook.watchlist=Array.isArray(s.ticketBook.watchlist)?s.ticketBook.watchlist:[];\n s.debtBook=s.debtBook||{items:[],review:[]};`,
          ` s.ticketBook=s.ticketBook||{items:[],watchlist:[],history:[],review:[]};s.ticketBook.items=Array.isArray(s.ticketBook.items)?s.ticketBook.items:[];s.ticketBook.watchlist=Array.isArray(s.ticketBook.watchlist)?s.ticketBook.watchlist:[];\n s.bettingLedger={bets:[],bankrollCzk:0,unitCzk:0,updatedAt:null,...(s.bettingLedger||{})};s.bettingLedger.bets=Array.isArray(s.bettingLedger.bets)?s.bettingLedger.bets:[];\n s.debtBook=s.debtBook||{items:[],review:[]};`);
          replace('js/state.js',
          ` if(input.ticketBook!==undefined&&typeof input.ticketBook!=='object')fatal.push('ticketBook má neplatný formát');\n if(input.debtBook!==undefined&&typeof input.debtBook!=='object')fatal.push('debtBook má neplatný formát');`,
          ` if(input.ticketBook!==undefined&&typeof input.ticketBook!=='object')fatal.push('ticketBook má neplatný formát');\n if(input.bettingLedger!==undefined&&typeof input.bettingLedger!=='object')fatal.push('bettingLedger má neplatný formát');\n if(input.bettingLedger?.bets!==undefined&&!Array.isArray(input.bettingLedger.bets))issues.push('bettingLedger.bets nebylo pole');\n if(input.debtBook!==undefined&&typeof input.debtBook!=='object')fatal.push('debtBook má neplatný formát');`);
          replace('js/state.js',
          ` scan(input.tasks,'task');scan(input.projects,'project');scan(input.ticketBook?.items,'ticket');scan(input.ticketBook?.watchlist,'ticket-watch');scan(input.debtBook?.items,'debt');`,
          ` scan(input.tasks,'task');scan(input.projects,'project');scan(input.ticketBook?.items,'ticket');scan(input.ticketBook?.watchlist,'ticket-watch');scan(input.bettingLedger?.bets,'bet');scan(input.debtBook?.items,'debt');`);
          replace('js/state.js',
          ` fixed.ticketBook.items=dedupe(fixed.ticketBook.items);fixed.ticketBook.watchlist=dedupe(fixed.ticketBook.watchlist);fixed.debtBook.items=dedupe(fixed.debtBook.items);`,
          ` fixed.ticketBook.items=dedupe(fixed.ticketBook.items);fixed.ticketBook.watchlist=dedupe(fixed.ticketBook.watchlist);fixed.bettingLedger.bets=dedupe(fixed.bettingLedger.bets);fixed.debtBook.items=dedupe(fixed.debtBook.items);`);

          replace('js/cloud.js',
          `  {label:'Vstupenky',local:count(local,'ticketBook.items'),cloud:count(cloud,'ticketBook.items')},\n  {label:'Pohledávky',local:count(local,'debtBook.items'),cloud:count(cloud,'debtBook.items')}`,
          `  {label:'Vstupenky',local:count(local,'ticketBook.items'),cloud:count(cloud,'ticketBook.items')},\n  {label:'Sázky',local:count(local,'bettingLedger.bets'),cloud:count(cloud,'bettingLedger.bets')},\n  {label:'Pohledávky',local:count(local,'debtBook.items'),cloud:count(cloud,'debtBook.items')}`);

          replace('betting_reliability_691_guard.mjs',
          ` 'api/market-history.js','lib/browser-chance-model694.js'`,
          ` 'api/market-history.js','api/core70-health.js','lib/browser-chance-model694.js'`);
          replace('betting_reliability_691_guard.mjs',
          `const feed=read('js/bettingOddsFeed693.js');assert.ok(feed.includes('resetPulseStop()'),'provider fallback must release stale PulseScore STOP state');`,
          `const coreHealth=read('api/core70-health.js');assert.ok(coreHealth.includes('PULSESCORE_UNVERIFIED'),'PulseScore health must expose an unverified state instead of assuming healthy');assert.ok(coreHealth.includes('pulsescore_verified:pulse.verified===true'),'provider verification flag missing from health contract');assert.ok(!coreHealth.includes("return{configured:true,ok:true,status:null,authMode:null,message:null}"),'configured PulseScore must never be assumed healthy without evidence');\nconst feed=read('js/bettingOddsFeed693.js');assert.ok(feed.includes('resetPulseStop()'),'provider fallback must release stale PulseScore STOP state');assert.ok(feed.includes("FALLBACK_HEALTH='/api/core70-health'"),'Chance feed must read truthful fallback health');assert.ok(feed.includes('PulseScore BASIC kvóta vyčerpaná'),'Chance UI must surface provider quota exhaustion');`);
          replace('betting_reliability_691_guard.mjs',
          `const ledger=read('js/bettingLedger543.js');assert.ok(ledger.includes('kamil:betting-ledger543-updated'),'canonical ledger update event missing');`,
          `const ledger=read('js/bettingLedger543.js');assert.ok(ledger.includes('kamil:betting-ledger543-updated'),'canonical ledger update event missing');assert.ok(ledger.includes("import {store} from './state.js'"),'betting ledger must use the canonical Kamil OS state');assert.ok(ledger.includes('s.bettingLedger=next'),'betting ledger writes must persist into canonical OS state');\nconst state=read('js/state.js');assert.ok(state.includes('bettingLedger:{bets:[]'),'canonical state must define bettingLedger');`);

          console.log('OS1061 provider and ledger repairs applied');
          NODE
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/core70-health.js js/bettingOddsFeed693.js js/bettingLedger543.js js/state.js js/cloud.js betting_reliability_691_guard.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix provider health and unify betting ledger state"
            git push origin HEAD:fix/provider-health-ledger-20260908
          fi
