name: OS947 Visual Rebuild QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Visual design contracts
        run: node scripts/visual_rebuild_947_guard.mjs
      - name: Navigation contract
        run: node compact_navigation_212_test.mjs
      - name: Syntax
        run: |
          node --check js/uxFoundation238.js
          node --check js/design304.js
          node --check js/instantShell64.js
      - name: Existing logic compatibility
        run: |
          node scripts/preview_pr_946_guard.mjs
          node scripts/safe_change_plan_945_guard.mjs
          node scripts/proposal_review_944_guard.mjs
          node autonomous_943_guard.mjs
          node self_improving_892_guard.mjs
          node copilot_842_guard.mjs
      - name: Install browser QA
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: OS947 desktop and mobile browser smoke
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kamil-os947-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx playwright test e2e_os947_visual.spec.mjs e2e_os212_compact_navigation.spec.mjs e2e_os181_current_smoke.spec.mjs --reporter=line
