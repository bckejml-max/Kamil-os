name: Build Windows Desktop

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: kamil-os-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful canonical QA for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            row="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f head_sha="${GITHUB_SHA}" -f event=push -f per_page=20 \
              --jq '.workflow_runs[] | select(.name=="Kamil OS Canonical Release + Browser QA") | [.status, (.conclusion // ""), (.id|tostring)] | @tsv' | head -n 1)"
            if [ -n "$row" ]; then
              IFS=$'\t' read -r status conclusion run_id <<< "$row"
              echo "Canonical QA run ${run_id}: status=${status} conclusion=${conclusion:-pending}"
              if [ "$status" = "completed" ]; then
                [ "$conclusion" = "success" ] && exit 0
                echo "Canonical QA did not pass for ${GITHUB_SHA}."
                exit 1
              fi
            else
              echo "Canonical QA for ${GITHUB_SHA} not registered yet."
            fi
            sleep 10
          done
          echo "Timed out waiting for canonical QA for ${GITHUB_SHA}."
          exit 1

  build-windows:
    needs: gate-canonical
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Prepare tagged Windows release
        working-directory: desktop
        shell: pwsh
        run: |
          npm run prepare:web
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $remote = (git ls-remote --tags origin "refs/tags/$tag").Trim()
          if ($remote) {
            $remoteSha = ($remote -split "\s+")[0]
            if ($remoteSha -ne $env:GITHUB_SHA) {
              throw "Release tag $tag already points to $remoteSha, expected $env:GITHUB_SHA."
            }
          } else {
            git tag $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag"
          }
          "KAMIL_DESKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        env:
          KAMIL_DESKTOP_BUILD: ${{ github.run_number }}

      - name: Build and publish Windows update
        working-directory: desktop
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --publish always 2>&1 | Tee-Object -FilePath publish.log
          if (Select-String -Path publish.log -Pattern 'skipped publishing|GitHub release not created') {
            throw 'Desktop release was not published. Version/tag synchronization failed.'
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          KAMIL_DESKTOP_BUILD: ${{ github.run_number }}

      - name: Upload installer and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: Kamil-OS-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
