name: Build Windows Desktop

on:
  workflow_run:
    workflows: ["Kamil OS Canonical Release + Browser QA"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kamil-os-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build and publish Windows update
        working-directory: desktop
        shell: pwsh
        run: |
          npm run publish:win 2>&1 | Tee-Object -FilePath publish.log
          if (Select-String -Path publish.log -Pattern 'skipped publishing|GitHub release not created') {
            throw 'Desktop release was not published. Version synchronization failed.'
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          KAMIL_DESKTOP_BUILD: ${{ github.run_number }}

      - name: Upload installer and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: Kamil-OS-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
