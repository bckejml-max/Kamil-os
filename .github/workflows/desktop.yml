name: Build Windows Desktop

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: kamil-os-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful canonical QA for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            row="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f head_sha="${GITHUB_SHA}" -f event=push -f per_page=20 \
              --jq '.workflow_runs[] | select(.name=="Kamil OS Canonical Release + Browser QA") | [.status, (.conclusion // ""), (.id|tostring)] | @tsv' | head -n 1)"
            if [ -n "$row" ]; then
              IFS=$'\t' read -r status conclusion run_id <<< "$row"
              echo "Canonical QA run ${run_id}: status=${status} conclusion=${conclusion:-pending}"
              if [ "$status" = "completed" ]; then
                [ "$conclusion" = "success" ] && exit 0
                echo "Canonical QA did not pass for ${GITHUB_SHA}."
                exit 1
              fi
            else
              echo "Canonical QA for ${GITHUB_SHA} not registered yet."
            fi
            sleep 10
          done
          echo "Timed out waiting for canonical QA for ${GITHUB_SHA}."
          exit 1

  build-windows:
    needs: gate-canonical
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Prepare tagged Windows release
        working-directory: desktop
        shell: pwsh
        run: |
          npm run prepare:web
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $remote = [string](git ls-remote --tags origin "refs/tags/$tag")
          if ($remote) {
            $remoteSha = ($remote -split "\s+")[0]
            if ($remoteSha -ne $env:GITHUB_SHA) {
              throw "Release tag $tag already points to $remoteSha, expected $env:GITHUB_SHA."
            }
          } else {
            git tag $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag"
          }
          "KAMIL_DESKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        env:
          KAMIL_DESKTOP_BUILD: ${{ github.run_number }}

      - name: Build Windows update package
        working-directory: desktop
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --publish never
          $exe = "dist/Kamil-OS-Setup-$env:KAMIL_DESKTOP_VERSION-x64.exe"
          $blockmap = "$exe.blockmap"
          $latest = "dist/latest.yml"
          foreach ($file in @($exe,$blockmap,$latest)) {
            if (-not (Test-Path $file)) { throw "Missing Windows release artifact: $file" }
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          KAMIL_DESKTOP_BUILD: ${{ github.run_number }}

      - name: Publish one complete GitHub release
        working-directory: desktop
        shell: pwsh
        run: |
          $version = $env:KAMIL_DESKTOP_VERSION
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          $exe = "dist/Kamil-OS-Setup-$version-x64.exe"
          $blockmap = "$exe.blockmap"
          $latest = "dist/latest.yml"

          gh release view $tag --repo $repo --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --verify-tag --title $version --notes "Kamil OS Windows $version" --draft
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft GitHub release $tag." }
          }

          gh release upload $tag $exe $blockmap $latest --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload all Windows release assets to $tag." }

          $assets = @(gh release view $tag --repo $repo --json assets --jq '.assets[].name')
          foreach ($expected in @((Split-Path $exe -Leaf),(Split-Path $blockmap -Leaf),'latest.yml')) {
            if ($assets -notcontains $expected) { throw "GitHub release $tag is missing $expected." }
          }

          gh release edit $tag --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish GitHub release $tag." }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: Kamil-OS-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
