name: Production Source Guard

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-source-main
  cancel-in-progress: true

jobs:
  validate-production-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Structural release integrity
        run: npm run test:structural

      - name: Production security contracts
        run: |
          node privacy_security_guard.mjs
          node ticket_gmail_sync_health_guard.mjs

      - name: Deployment ownership
        run: echo 'Production deployment is owned by the Vercel Git integration for main; the canonical browser workflow owns the full release suite.'
