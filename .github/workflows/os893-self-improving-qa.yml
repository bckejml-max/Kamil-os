name: OS893 Self-Improving Outcome QA
on:
  pull_request:
    paths:
      - 'js/usageBridge893.js'
      - 'js/selfImproving893.js'
      - 'js/personalShell640.js'
      - 'js/personalMore640.js'
      - 'self_improving_893_guard.mjs'
      - '.github/workflows/os893-self-improving-qa.yml'
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node self_improving_893_guard.mjs
      - run: node self_improving_892_guard.mjs
      - run: node copilot_842_guard.mjs
