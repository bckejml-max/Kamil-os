name: Core 70 smoke

on:
  push:
    branches: [main]
    paths:
      - 'api/core70-health.js'
      - 'lib/api-football-model.js'
      - 'lib/football-data-poisson.js'
      - 'lib/football-data-count-model.js'
      - 'lib/football-data-count-resolver.js'
      - 'lib/chance-football-data-model.js'
      - 'lib/conservative-poisson-calibration.js'
      - 'lib/auto-betting-model.js'
      - 'api_football_model_test.mjs'
      - 'core70_auto_model_test.mjs'
      - 'football_data_poisson_test.mjs'
      - 'football_data_count_model_test.mjs'
      - 'football_data_count_resolver_test.mjs'
      - 'chance_league_mapping_test.mjs'
      - 'conservative_poisson_calibration_test.mjs'
      - 'core70.css'
      - 'CORE70.md'
      - '.github/workflows/core70.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/core70-health.js'
      - 'lib/api-football-model.js'
      - 'lib/football-data-poisson.js'
      - 'lib/football-data-count-model.js'
      - 'lib/football-data-count-resolver.js'
      - 'lib/chance-football-data-model.js'
      - 'lib/conservative-poisson-calibration.js'
      - 'lib/auto-betting-model.js'
      - 'api_football_model_test.mjs'
      - 'core70_auto_model_test.mjs'
      - 'football_data_poisson_test.mjs'
      - 'football_data_count_model_test.mjs'
      - 'football_data_count_resolver_test.mjs'
      - 'chance_league_mapping_test.mjs'
      - 'conservative_poisson_calibration_test.mjs'
      - 'core70.css'
      - 'CORE70.md'
      - '.github/workflows/core70.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Required Core70 model files
        run: |
          test -f core70.css
          test -f api/core70-health.js
          test -f lib/api-football-model.js
          test -f lib/football-data-poisson.js
          test -f lib/football-data-count-model.js
          test -f lib/football-data-count-resolver.js
          test -f lib/chance-football-data-model.js
          test -f lib/conservative-poisson-calibration.js
          test -f lib/auto-betting-model.js
          test -f api_football_model_test.mjs
          test -f core70_auto_model_test.mjs
          test -f football_data_poisson_test.mjs
          test -f football_data_count_model_test.mjs
          test -f football_data_count_resolver_test.mjs
          test -f chance_league_mapping_test.mjs
          test -f conservative_poisson_calibration_test.mjs
      - name: Syntax check Core70 model JavaScript
        run: |
          node --check api/core70-health.js
          node --check lib/api-football-model.js
          node --check lib/football-data-poisson.js
          node --check lib/football-data-count-model.js
          node --check lib/football-data-count-resolver.js
          node --check lib/chance-football-data-model.js
          node --check lib/conservative-poisson-calibration.js
          node --check lib/auto-betting-model.js
      - name: Betting model safety tests
        run: |
          node api_football_model_test.mjs
          node core70_auto_model_test.mjs
          node football_data_poisson_test.mjs
          node football_data_count_model_test.mjs
          node football_data_count_resolver_test.mjs
          node chance_league_mapping_test.mjs
          node conservative_poisson_calibration_test.mjs
