name: OS1061 Provider Ledger Repair V2
on:
  push:
    branches: [fix/provider-health-ledger-20260908]
    paths:
      - '.github/workflows/os1061-provider-ledger-repair-v2.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-health-ledger-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract corrected repair script
        shell: bash
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const yaml=fs.readFileSync('.github/workflows/os1061-provider-ledger-repair.yml','utf8');
          const start="          node <<'NODE'\n";
          const end='\n          NODE';
          const a=yaml.indexOf(start),b=yaml.indexOf(end,a+start.length);
          if(a<0||b<0)throw new Error('repair script block not found');
          let body=yaml.slice(a+start.length,b).split('\n').map(line=>line.replace(/^          /,'')).join('\n');
          body=body.replace('originalFetch(\\`${HEALTH}&_=\\${Date.now()}\\`,{cache:',"originalFetch(HEALTH+'&_='+Date.now(),{cache:");
          body=body.replace('originalFetch(\\`${FALLBACK_HEALTH}?_=\\${Date.now()}\\`,{cache:',"originalFetch(FALLBACK_HEALTH+'?_='+Date.now(),{cache:");
          if(body.includes('originalFetch(\\`${HEALTH}'))throw new Error('primary nested template fix failed');
          if(body.includes('originalFetch(\\`${FALLBACK_HEALTH}'))throw new Error('fallback nested template fix failed');
          fs.writeFileSync('/tmp/os1061-repair.mjs',body);
          NODE
          node /tmp/os1061-repair.mjs
      - name: Syntax and betting guard
        shell: bash
        run: |
          node --check api/core70-health.js
          node --check js/bettingOddsFeed693.js
          node --check js/bettingLedger543.js
          node --check js/state.js
          node --check js/cloud.js
          node betting_reliability_691_guard.mjs
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/core70-health.js js/bettingOddsFeed693.js js/bettingLedger543.js js/state.js js/cloud.js betting_reliability_691_guard.mjs
          git commit -m "Fix provider health and unify betting ledger state"
          git push origin HEAD:fix/provider-health-ledger-20260908
