name: OS790 Strategy Command QA
on:
  pull_request:
    paths:
      - 'js/strategyCommand790.js'
      - 'js/bettingBootstrap543.js'
      - 'strategy_command_790_guard.mjs'
      - '.github/workflows/os790-strategy-command.yml'
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node strategy_command_790_guard.mjs
      - run: node strategy_788_guard.mjs
      - run: node strategy_polish_789_guard.mjs
