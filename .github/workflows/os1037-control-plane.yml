name: OS1037 Control Plane QA
on:
  pull_request:
    paths:
      - 'js/controlPlane1037.js'
      - 'js/controlPlane1037Boot.js'
      - 'js/personalMore640.js'
      - 'js/bettingBootstrap543.js'
      - 'scripts/control_plane_1037_guard.mjs'
      - 'e2e_control_plane_1037.spec.mjs'
      - '.github/workflows/os1037-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'js/controlPlane1037.js'
      - 'js/controlPlane1037Boot.js'
      - 'js/bettingBootstrap543.js'
      - 'scripts/control_plane_1037_guard.mjs'
      - '.github/workflows/os1037-control-plane.yml'
  workflow_dispatch:
jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OS988-1037 contracts
        run: node scripts/control_plane_1037_guard.mjs
      - name: One OS and cleanup compatibility
        run: |
          node scripts/legacy_cleanup_987_guard.mjs
          node scripts/one_os_977_guard.mjs
          node scripts/one_os_967_guard.mjs
          node scripts/visual_rebuild_947_guard.mjs
      - name: Safety compatibility
        run: |
          node self_improving_892_guard.mjs
          node copilot_842_guard.mjs
          node strategy_command_790_guard.mjs
      - name: Install browser QA
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: OS1037 browser smoke
        id: browser
        continue-on-error: true
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kamil-os1037-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx playwright test e2e_control_plane_1037.spec.mjs e2e_legacy_cleanup_987.spec.mjs e2e_one_os_977.spec.mjs e2e_one_os_967.spec.mjs e2e_os947_visual.spec.mjs --reporter=json > os1037-playwright.json
      - name: Upload OS1037 browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os1037-playwright-report
          path: os1037-playwright.json
          retention-days: 3
      - name: Browser QA gate
        if: steps.browser.outcome != 'success'
        run: exit 1
