name: OS1061 Provider Ledger Followup
on:
  push:
    branches: [fix/provider-health-ledger-20260908]
    paths:
      - '.github/workflows/os1061-provider-ledger-followup.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-health-ledger-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply followup hardening
        shell: bash
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const replace=(file,from,to)=>{let t=fs.readFileSync(file,'utf8');if(!t.includes(from))throw new Error(`${file}: source block not found`);fs.writeFileSync(file,t.replace(from,to))};
          replace('js/bettingLedger543.js',
          `async function hydrate(){const hadCanonical=!!store.get()?.bettingLedger,hadLegacy=!!localStorage.getItem(LEGACY_STORE)||!!localStorage.getItem(CONFIRMED542);let state=migrate542(read());const remote=await apiGet();if(remote?.ok){serverWritable=remote.writable===true;storageMode=serverWritable?(remote.storage||'kv'):'os_state';state.bets=merge(remote.bets,state.bets);if(!state.bankrollCzk)state.bankrollCzk=Number(remote.bankrollCzk||0);if(!state.unitCzk)state.unitCzk=Number(remote.unitCzk||0)}write(state,{cloud:!hadCanonical&&hadLegacy});syncRender()}`,
          `async function hydrate(){const canonicalBefore=store.get()?.bettingLedger,hadCanonicalData=!!(canonicalBefore?.updatedAt||(canonicalBefore?.bets||[]).length||canonicalBefore?.bankrollCzk||canonicalBefore?.unitCzk),hadLegacy=!!localStorage.getItem(LEGACY_STORE)||!!localStorage.getItem(CONFIRMED542);let state=migrate542(read());const remote=await apiGet();if(remote?.ok){serverWritable=remote.writable===true;storageMode=serverWritable?(remote.storage||'kv'):'os_state';state.bets=merge(remote.bets,state.bets);if(!state.bankrollCzk)state.bankrollCzk=Number(remote.bankrollCzk||0);if(!state.unitCzk)state.unitCzk=Number(remote.unitCzk||0)}write(state,{cloud:!hadCanonicalData&&hadLegacy});syncRender()}`);
          replace('betting_reliability_691_guard.mjs',
          ` 'api/market-history.js','api/core70-health.js','lib/browser-chance-model694.js'`,
          ` 'api/market-history.js','api/core70-health.js','lib/browser-chance-model694.js','js/state.js','js/cloud.js'`);
          replace('betting_reliability_691_guard.mjs',
          `const state=read('js/state.js');assert.ok(state.includes('bettingLedger:{bets:[]'),'canonical state must define bettingLedger');\nconsole.log('OS695 BETTING RELIABILITY PASS');`,
          `const state=read('js/state.js');assert.ok(state.includes('bettingLedger:{bets:[]'),'canonical state must define bettingLedger');assert.ok(state.includes("scan(input.bettingLedger?.bets,'bet')"),'betting ledger IDs must participate in canonical state validation');\nconst cloud=read('js/cloud.js');assert.ok(cloud.includes("count(local,'bettingLedger.bets')"),'cloud conflict summary must include betting history');\nconst oldPulseKey=process.env.PULSESCORE_API_KEY;process.env.PULSESCORE_API_KEY='os1061-test-key';const {default:healthHandler}=await import(\`./api/core70-health.js?os1061=\${Date.now()}\`);let healthStatus=0,healthBody=null;const healthRes={setHeader(){},set statusCode(v){healthStatus=v},get statusCode(){return healthStatus},end(v){healthBody=JSON.parse(v)}};await healthHandler({method:'GET',url:'/api/core70-health'},healthRes);assert.equal(healthStatus,200);assert.equal(healthBody.checks.pulsescore_configured,true);assert.equal(healthBody.checks.pulsescore_verified,false);assert.equal(healthBody.checks.pulsescore_api,false);assert.equal(healthBody.pulse.message,'PULSESCORE_UNVERIFIED');if(oldPulseKey===undefined)delete process.env.PULSESCORE_API_KEY;else process.env.PULSESCORE_API_KEY=oldPulseKey;\nconsole.log('OS1061 BETTING RELIABILITY PASS');`);
          NODE
      - name: Verify
        run: |
          node --check js/bettingLedger543.js
          node betting_reliability_691_guard.mjs
      - name: Commit followup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/bettingLedger543.js betting_reliability_691_guard.mjs
          git commit -m "Harden betting ledger migration and provider health contract"
          git push origin HEAD:fix/provider-health-ledger-20260908
