</script><script>function normKey(k){return String(k||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function pick(o,keys){for(const k of Object.keys(o)){if(keys.includes(normKey(k)))return o[k]}return null}
function num(v){if(typeof v==='number')return v;let x=String(v??'').trim().replace(/\s/g,'').replace('%','').replace(',','.');let n=Number(x);return Number.isFinite(n)?n:null}
async function importXTB(inp){
 const f=inp.files?.[0]; if(!f)return;
 try{
  const buf=await f.arrayBuffer(); const wb=XLSX.read(buf,{type:'array',cellDates:true});
  let rows=[];
  for(const sn of wb.SheetNames){const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:null}); if(a.length>rows.length)rows=a}
  if(!rows.length)throw new Error('Soubor neobsahuje tabulková data.');
  const aliases={
   ticker:['symbol','ticker','instrumentticker','instrument','symbolcode'],
   name:['name','instrumentname','nazev','description'],
   qty:['quantity','qty','volume','shares','ks','position'],
   value:['marketvalue','marketvalueczk','hodnotak','valueczk','positionvalue','currentvalue'],
   pl:['pl','pnl','profitloss','unrealizedpl','ziskztrata','plpercent','plpct'],
   plczk:['plczk','pnlczk','profitlossczk','unrealizedplczk'],
   price:['price','currentprice','marketprice'],
   fx:['fx','fxczk','exchangerate']
  };
  const intel=new Map(base.xtb.positions.map(x=>[x.ticker,x]));
  let ps=[];
  for(const r of rows){
    let ticker=pick(r,aliases.ticker), name=pick(r,aliases.name);
    if(!ticker)continue; ticker=String(ticker).trim();
    let value=num(pick(r,aliases.value)), qty=num(pick(r,aliases.qty)), price=num(pick(r,aliases.price)), fx=num(pick(r,aliases.fx));
    if(value==null && qty!=null && price!=null)value=qty*price*(fx||1);
    if(value==null || value<=0)continue;
    let rawpl=num(pick(r,aliases.pl)), plczk=num(pick(r,aliases.plczk)), pl=rawpl;
    if(pl!=null && Math.abs(pl)>2)pl/=100;
    const old=intel.get(ticker)||{};
    ps.push({name:String(name||old.name||ticker),ticker,type:old.type||'—',value,weight:0,pl:pl??old.pl??0,plczk:plczk??old.plczk??0,verdict:old.verdict||'—',confidence:old.confidence??null});
  }
  const dedup=new Map(); for(const p of ps)dedup.set(p.ticker,p); ps=[...dedup.values()];
  if(ps.length<3)throw new Error('Nepodařilo se rozpoznat pozice. Export musí obsahovat alespoň ticker/symbol a hodnotu pozice.');
  const total=ps.reduce((a,x)=>a+x.value,0); ps.forEach(x=>x.weight=x.value/total);
  s.xtb={...s.xtb,value:total,positions:ps,asOf:new Date().toISOString(),source:'Import '+f.name,marketEstimate:null};
  save(); setTimeout(()=>{const m=document.getElementById('xtbmsg');if(m)m.textContent=`Import OK: ${ps.length} pozic · ${cz(total)}`},0)
 }catch(e){const m=document.getElementById('xtbmsg'); if(m)m.textContent='Import selhal: '+e.message}
 finally{inp.value=''}
}


function curForTicker(t){if(t.endsWith('.DE')||t.endsWith('.ES'))return'EUR';if(t.endsWith('.US'))return'USD';return null}
function postSaleRows(){
 const m=s.tradeJournal.market?.prices||{};
 return (s.tradeJournal.trades||[]).filter(x=>x.kind==='INVESTMENT').map(x=>{
   const q=m[x.ticker]; let hypothetical=null,opportunity=null,movePct=null;
   if(q?.price&&q?.fx&&x.avgClose){
     hypothetical=x.volume*q.price*q.fx;
     opportunity=hypothetical-x.saleValue;
     movePct=q.price/x.avgClose-1;
   }
   const threshold=Math.max(500,(x.saleValue||0)*0.02);
   let verdict='ČEKÁ NA LIVE CENU',grade='muted';
   if(opportunity!=null){
     if(opportunity<=-threshold){
       verdict=x.realized<0?'ZACHRÁNĚNÁ ZTRÁTA':'PRODÁNO DOBŘE';grade='green';
     }else if(opportunity>=threshold){
       verdict=x.realized<0?'ZTRÁTA + NÁSLEDNÝ RŮST':'PRODÁNO BRZO';grade='red';
     }else{
       verdict='NEUTRÁLNÍ EXIT';grade='muted';
     }
   }
   return {...x,q,hypothetical,opportunity,movePct,threshold,verdict,grade};
 });
}
function postSaleStats(){
 const rows=postSaleRows(),live=rows.filter(x=>x.opportunity!=null);
 const opportunity=live.reduce((a,x)=>a+x.opportunity,0);
 const realized=rows.reduce((a,x)=>a+(x.realized||0),0);
 const good=live.filter(x=>x.opportunity<=-x.threshold);
 const early=live.filter(x=>x.opportunity>=x.threshold);
 const saved=good.reduce((a,x)=>a+Math.max(0,-x.opportunity),0);
 const missed=early.reduce((a,x)=>a+Math.max(0,x.opportunity),0);
 const best=[...live].sort((a,b)=>a.opportunity-b.opportunity)[0]||null;
 const worst=[...live].sort((a,b)=>b.opportunity-a.opportunity)[0]||null;
 return {rows,live,opportunity,realized,good,early,saved,missed,best,worst};
}

function lessonsLearned(){
 const x=postSaleStats(), rows=x.live;
 const winners=rows.filter(r=>(r.realized||0)>0);
 const losers=rows.filter(r=>(r.realized||0)<0);
 const winnerEarly=winners.filter(r=>r.opportunity>=r.threshold);
 const winnerGood=winners.filter(r=>r.opportunity<=-r.threshold);
 const loserBounce=losers.filter(r=>r.opportunity>=r.threshold);
 const loserSaved=losers.filter(r=>r.opportunity<=-r.threshold);
 const avg=(a,fn)=>a.length?a.reduce((s,r)=>s+fn(r),0)/a.length:0;
 const avgWinnerPost=avg(winners,r=>r.movePct||0), avgLoserPost=avg(losers,r=>r.movePct||0);
 const patterns=[];
 if(winnerEarly.length>=2 || (winners.length>=3&&winnerEarly.length/winners.length>=0.4))patterns.push({severity:'amber',title:'Vítěze možná prodáváš příliš brzo',detail:`${winnerEarly.length}/${winners.length} ziskových exitů pokračovalo výrazně nahoru po prodeji.`});
 if(loserBounce.length>=2 || (losers.length>=3&&loserBounce.length/losers.length>=0.4))patterns.push({severity:'amber',title:'Část ztrát realizuješ před odrazem',detail:`${loserBounce.length}/${losers.length} ztrátových exitů se po prodeji výrazně zotavilo.`});
 if(loserSaved.length>=2)patterns.push({severity:'green',title:'Umíš utnout část špatných pozic včas',detail:`${loserSaved.length} ztrátových exitů po prodeji dál klesalo.`});
 if(winnerGood.length>=2)patterns.push({severity:'green',title:'Umíš zamknout zisk před poklesem',detail:`${winnerGood.length} ziskových exitů po prodeji výrazně oslabilo.`});
 if(!patterns.length&&rows.length)patterns.push({severity:'green',title:'Zatím bez silného behaviorálního vzorce',detail:'Historie exitů zatím neukazuje jednoznačnou opakovanou chybu.'});
 const rules=[];
 if(winnerEarly.length>=2)rules.push('U ziskové pozice před úplným prodejem zvaž částečný exit místo 100% prodeje.');
 if(loserBounce.length>=2)rules.push('U ztrátové pozice před prodejem ověř, zda se změnila investiční teze, ne jen cena.');
 if(loserSaved.length>=2)rules.push('U porušené investiční teze pokračuj v rychlém řezu ztráty.');
 if(!rules.length)rules.push('Sbírej další exity; behavior engine se zpřesní s historií.');
 return {rows,winners,losers,winnerEarly,winnerGood,loserBounce,loserSaved,avgWinnerPost,avgLoserPost,patterns,rules};
}

}
function simulatorScore(s){

   if(/faktur|platb|peněz|pokut|smlouv|termín|doklad|občank|řidič/i.test(title))add(18,'administrativní / finanční dopad');
 }
 if(x.kind==='routine'){
   const diff=daysBetween(x.d,today);
   if(diff<=0)add(40,'termín dnes / po termínu');
   else if(diff===1)add(30,'termín zítra');
   else if(diff<=3)add(18,'termín do 3 dnů');
 }
 if(x.kind==='delegation'){
   if(x.overdue)add(38,'kontrola delegace po termínu');
   else add(12,'aktivní delegace');
   if(x.nudges)add(Math.min(18,x.nudges*6),`${x.nudges} urgence`);
   if(!x.owner)add(20,'chybí vlastník');
 }
 if(x.kind==='calendar'){
   const st=new Date(x.start),mins=(st-now)/60000;
   if(mins>=0&&mins<=120)add(30,'schůzka do 2 hodin');
   else if(daysBetween(st,today)===0)add(20,'dnes v kalendáři');
   if(x.busy)add(6,'blokuje čas');
 }
 if(x.kind==='finance'){
   const diff=daysBetween(new Date(x.start),today);
   if(diff<=3)add(25,'platba do 3 dnů');
   else if(diff<=7)add(15,'platba do týdne');
   const a=Number(x.amount||0);
   if(a>=50000)add(20,'významná částka');
   else if(a>=10000)add(10,'vyšší částka');
 }
 if(x.kind==='investment'){
   add(Math.min(45,Math.round((x.reviewScore||0)*0.7)),'investiční review score');
   if(x.reviewPriority==='KRITICKÁ')add(20,'kritická investiční revize');
   else if(x.reviewPriority==='VYSOKÁ')add(10,'vysoká investiční revize');
 }
 if(/Nová Zbrojovka|fakturace|docházka|cesták|karta zakázky/i.test(title))add(10,'pracovní provoz / deadline');
 if(area==='Práce')add(5,'pracovní dopad');
 return {score:Math.min(100,Math.round(score)),reasons};
}
function autoPriorityItems(){
 const now=new Date(),today=dayStart(now),items=[];
 for(const t of (s.tasks||[])){
   if(t.status==='HOTOVO')continue;
   items.push({kind:'task',title:t.title,area:t.area||'Úkoly',priority:t.priority,status:t.status,due:t.due});
 }
 for(const r of (s.routines||[])){
   const d=due(r);if(s.routineDone?.[key(r,d)])continue;
   const diff=daysBetween(d,today);if(diff>=0&&diff<=7)items.push({kind:'routine',title:r.title,area:r.area||'Rutiny',d});
 }
 try{
   for(const d of delegationState()){
     if(d.status==='DONE')continue;
     items.push({kind:'delegation',title:d.title,area:'Delegace',owner:d.owner,nudges:d.lastNudgeAt?1:0,overdue:!!(d.followUpAt&&new Date(d.followUpAt)<now)});
   }
 }catch{}
 for(const e of (s.calendar?.events||[])){
   const st=new Date(e.start),diff=daysBetween(st,today);if(diff>=0&&diff<=1)items.push({kind:'calendar',title:e.title,area:'Kalendář',start:e.start,busy:e.busy});
 }
 try{
   for(const p of financeCalendar().slice(0,10))items.push({kind:'finance',title:p.title,area:'Finance',start:p.start,amount:p.amount});
 }catch{}
 try{
   for(const q of thesisReviewQueue().slice(0,8))items.push({kind:'investment',title:q.ticker+' · revize teze',area:'Investice',reviewScore:q.reviewScore,reviewPriority:q.reviewPriority});
 }catch{}
 return items.map(x=>({...x,...priorityScoreItem(x)})).sort((a,b)=>b.score-a.score);
}

function parseQuickCapture(text){
 const raw=String(text||'').trim();
 const low=raw.toLowerCase();
 let kind='task',owner='',title=raw,due=null,priority='NORMAL';
 if(/urgent|urgovat|urgence|follow.?up/.test(low))kind='delegation';
 else if(/delegovat|předat/.test(low))kind='delegation';
 else if(/poznámk|note/.test(low))kind='note';
 else if(/invest|xtb|akci|etf/.test(low))kind='investment-note';
 if(/dnes/.test(low))due=new Date();
 else if(/zítra/.test(low)){due=new Date();due.setDate(due.getDate()+1)}
 else if(/high|vysoká priorita|kritick/.test(low))priority='HIGH';
 const m=raw.match(/(?:komu|pro|delegovat)\s+([A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][\wÁ-ž-]+)/i);
 if(m)owner=m[1];
 title=raw.replace(/^(úkol|task|poznámka|note|delegovat|předat|urgovat|urgence|follow[- ]?up)\s*[:\-]?\s*/i,'').trim();
 return {kind,title,owner,due,priority,raw};
}

 for(const t of (s.tasks||[])){

function waitingForItems(){
 const now=Date.now(), rows=[];
 // Tasks explicitly waiting
 for(const t of (s.tasks||[])){
   if(t.status!=='ČEKÁM')continue;
   const since=t.updatedAt||t.createdAt||null;
   const days=since?Math.floor((now-new Date(since))/86400000):null;
   rows.push({id:'task|'+(t.id||t.title),kind:'task',title:t.title,owner:t.owner||'',since,days,followUpAt:t.followUpAt||null,source:t});
 }
 // Delegations
 try{
   for(const d of delegationState()){
     if(d.status==='DONE')continue;
     const since=d.createdAt||null;
     const days=since?Math.floor((now-new Date(since))/86400000):null;
     rows.push({id:'del|'+d.id,kind:'delegation',title:d.title,owner:d.owner||'',since,days,followUpAt:d.followUpAt||null,source:d});
   }
 }catch{}
 return rows.sort((a,b)=>{
   const ao=a.followUpAt?new Date(a.followUpAt).getTime():Infinity;
   const bo=b.followUpAt?new Date(b.followUpAt).getTime():Infinity;
   return ao-bo;
 });
}
function waitingUrgency(x){
 const now=Date.now(); let score=0,reasons=[];
 if(x.followUpAt){
   const diff=(new Date(x.followUpAt).getTime()-now)/86400000;
   if(diff<0){score+=50;reasons.push('follow-up po termínu')}

function todaysBusyBlocks(){
 const now=new Date(),start=dayStart(now),end=new Date(start.getTime()+86400000);
 return (s.calendar?.events||[])
  .filter(e=>e.busy&&!e.allDay&&new Date(e.start)<end&&new Date(e.end)>start)
  .map(e=>({title:e.title,start:new Date(e.start),end:new Date(e.end)}))
  .sort((a,b)=>a.start-b.start);
}
function minutesBetween(a,b){return Math.max(0,Math.round((b-a)/60000))}
function mergeBusy(blocks){
 if(!blocks.length)return [];
 const out=[{...blocks[0]}];
 for(const b of blocks.slice(1)){
   const last=out[out.length-1];
   if(b.start<=last.end){if(b.end>last.end)last.end=b.end}
   else out.push({...b});
 }
 return out;
}
function workingWindow(){
 const now=new Date();
 const start=new Date(now);start.setHours(8,0,0,0);
 const end=new Date(now);end.setHours(17,0,0,0);
 return {start,end};
}
function freeWindows(){
 const w=workingWindow(),busy=mergeBusy(todaysBusyBlocks()
   .map(b=>({start:new Date(Math.max(b.start,w.start)),end:new Date(Math.min(b.end,w.end)),title:b.title}))
   .filter(b=>b.end>b.start));
 const out=[];let cur=new Date(w.start);
 for(const b of busy){
   if(b.start>cur)out.push({start:new Date(cur),end:new Date(b.start)});
   if(b.end>cur)cur=new Date(b.end);
 }
 if(cur<w.end)out.push({start:new Date(cur),end:new Date(w.end)});
 return out.filter(x=>minutesBetween(x.start,x.end)>=20);
}
function baseEstimateDuration(x){
 if(x.kind==='calendar')return 0;
 if(x.kind==='investment')return 20;
 if(x.kind==='delegation')return 10;
 if(x.kind==='finance')return 15;
 if(x.kind==='routine'){
   const t=(x.title||'').toLowerCase();
   if(/docház|cesták|faktur/.test(t))return 25;
   return 20;
 }
 const t=(x.title||'').toLowerCase();
 if(/email|mail|zavolat|telefon|urgovat/.test(t))return 10;
 if(/občank|řidič|úřad/.test(t))return 45;
 return x.score>=75?45:x.score>=50?30:20;
}
function estimateDuration(x){
 const base=baseEstimateDuration(x);
 return typeof learnedDuration==='function'?learnedDuration(base):base;
}
function buildDayPlan(){
 const now=new Date(),items=autoPriorityItems()
   .filter(x=>x.kind!=='calendar')
   .slice(0,10)
   .map(x=>({...x,duration:estimateDuration(x)}));
 const windows=freeWindows();
 const plan=[],unplanned=[];
 for(const item of items){
   let placed=false;
   for(const win of windows){
     const available=minutesBetween(win.start,win.end);
     if(available>=item.duration){
       const st=new Date(win.start),en=new Date(st.getTime()+item.duration*60000);
       plan.push({...item,start:st,end:en});
       win.start=new Date(en.getTime()+5*60000);
       placed=true;break;
     }
   }
   if(!placed)unplanned.push(item);
 }
 return {plan,unplanned,windows:freeWindows(),busy:todaysBusyBlocks(),now};
}

function executionLearning(){
 const log=executionLog().filter(x=>x.status==='DONE'&&x.planned>0&&x.actual>=0);
 const recent=log.slice(-50);
 const ratio=recent.length?recent.reduce((a,x)=>a+(x.actual/x.planned),0)/recent.length:1;
 const accuracy=recent.length?Math.max(0,Math.round(100-Math.abs(1-ratio)*100)):100;
 const byType={short:[],medium:[],long:[]};
 recent.forEach(x=>byType[x.planned<=15?'short':x.planned<=30?'medium':'long'].push(x.actual/x.planned));
 const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:1;
 return {count:recent.length,ratio,accuracy,multipliers:{short:avg(byType.short),medium:avg(byType.medium),long:avg(byType.long)}};
}
function learnedDuration(base){
 const l=executionLearning();
 const k=base<=15?l.multipliers.short:base<=30?l.multipliers.medium:l.multipliers.long;

}

function morningCandidates(){
 const now=new Date(), today=dayStart(now), out=[];

 // 1) Calendar: timed meetings today/tomorrow and all-day deadlines
 for(const e of (s.calendar?.events||[])){
   const st=new Date(e.start), diff=daysBetween(st,today);
   if(diff<0||diff>2)continue;
   const timed=!e.allDay;
   let score=0,why='';
   if(diff===0&&timed){score=95;why='dnes v '+st.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'})}
   else if(diff===0){score=88;why='termín dnes'}
   else if(diff===1){score=74;why='zítra'}
   else {score=56;why='za 2 dny'}
   if(e.busy)score+=4;
   out.push({area:'Kalendář',title:e.title,score,why,when:st,kind:'calendar'});
 }

 // 2) Tasks / waiting items
 for(const t of (s.tasks||[])){
   if(t.status==='HOTOVO')continue;
   let score=55,why=t.status||'úkol';
   if(t.priority==='HIGH'||t.priority==='VYSOKÁ')score+=25;
   if(t.status==='UDĚLAT')score+=10;
   if(/ček|odpově|waiting/i.test(t.status||''))score-=10;
   if(/faktur|termín|smlouv|zakáz|platb|pojišt|doklad|řidič|občan/i.test(t.title||''))score+=12;
   out.push({area:'Úkoly',title:t.title,score,why,kind:'task'});
 }

 // 3) Monthly routines
 for(const r of (s.routines||[])){
   try{
     const d=due(r), delta=Math.round((d-today)/86400000);
     if(delta>7)continue;
     const done=s.routineDone?.[key(r,d)];
     if(done)continue;
     let score=delta<0?96:delta===0?94:delta<=2?82:66;
     out.push({area:'Řízení',title:r.title||r.name,score,why:delta<0?`po termínu ${Math.abs(delta)} d`:delta===0?'dnes':`za ${delta} d`,kind:'routine'});
   }catch{}
 }

 // 4) Upcoming money outflows
 try{
   for(const e of financeCalendar()){
     const st=new Date(e.start), delta=daysBetween(st,today);
     if(delta>7)continue;
     const amount=e.amount||0;
     let score=delta===0?90:delta<=2?78:64;
     if(amount>=10000)score+=8;
     if(amount>=30000)score+=5;
     out.push({area:'Finance',title:e.title,score,why:`${delta===0?'dnes':delta===1?'zítra':'za '+delta+' d'} · ${cz(amount)}`,kind:'finance'});
   }
 }catch{}


 // 5) Delegated items needing ownership / follow-up
 try{
   out.push(...delegationCandidatesForMorning());
 }catch{}

 // 6) Investment actions only if there is something actually actionable
 try{
   const cc=commandCenterData();
   if(cc.total>cc.completed){
     out.push({area:'Investice',title:`Dokončit měsíční investiční plán`,score:58,why:`zbývá ${cc.total-cc.completed} nákupů · ${cz(cc.pendingAmount)}`,kind:'invest'});
   }
   if(cc.reviews.length){
     const r=cc.reviews[0];
     out.push({area:'Investice',title:`Review ${r.entry.ticker} · ${r.milestone.label}`,score:52+Math.min(20,Math.max(0,r.milestone.overdue)),why:`checkpoint čeká`,kind:'review'});
   }
 }catch{}

 return out.sort((a,b)=>b.score-a.score);
}
function morningTop3(){
 const all=morningCandidates().filter(x=>{
   try{
     const st=executionStatus(x);
     return st!=='DONE'&&st!=='TOMORROW';
   }catch{return true}

   if(chosen.length>=3)break;
   const duplicate=chosen.some(y=>y.title===x.title);

   // Prefer diversity unless urgency is extreme.
   if(usedKinds.has(x.kind)&&x.score<90&&all.some(y=>!usedKinds.has(y.kind)&&y.score>=x.score-12))continue;
   chosen.push(x);usedKinds.add(x.kind);
 }

   for(const x of all)if(chosen.length<3&&!chosen.some(y=>y.title===x.title))chosen.push(x);

}

function delegationOwnerStats(){
 const arr=delegationState();
 const by={};
 for(const x of arr){
   const owner=(x.owner||'Bez vlastníka').trim()||'Bez vlastníka';
   if(!by[owner])by[owner]={owner,total:0,done:0,lateDone:0,nudges:0,onTime:0,open:0};
   const o=by[owner];o.total++;
   if(x.lastNudgeAt)o.nudges++;
   if(x.status==='DONE'){
     o.done++;
     const late=x.followUpAt&&x.doneAt&&new Date(x.doneAt)>new Date(x.followUpAt);
     if(late)o.lateDone++; else o.onTime++;
   } else o.open++;
 }
 return Object.values(by).map(o=>{
   const completed=Math.max(1,o.done);
   const reliability=Math.max(0,Math.min(100,Math.round(
     (o.onTime/completed)*70 +
     ((o.done-o.lateDone)/completed)*20 -
     Math.min(20,o.nudges*4) +
     (o.done?10:0)
   )));
   return {...o,reliability};
 }).sort((a,b)=>b.reliability-a.reliability);
}
function delegationCycleDays(x){
 if(!x.createdAt||!x.doneAt)return null;
 return Math.max(0,(new Date(x.doneAt)-new Date(x.createdAt))/86400000);
}
function saveDelegationResult(id,value){
 const x=delegationState().find(d=>d.id===id);if(!x)return;
 x.result=value;

   </table></div>
 </div>
 <div class="card full"><h2>Dokončené delegace</h2>
   ${done.map(x=>`<div class="row">
      <div><b>${x.title}</b><div class="muted">${x.owner||'Bez vlastníka'} · ${delegationCycleDays(x)==null?'—':delegationCycleDays(x).toFixed(1)+' d'} · hotovo ${new Date(x.doneAt).toLocaleDateString('cs-CZ')}</div></div>
