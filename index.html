function moneyFromTitle(t){
 const m=String(t||'').replace(/\u00a0/g,' ').match(/(\d{1,3}(?:[ .]\d{3})*(?:[.,]\d{1,2})?)\s*Kč/i);
 if(!m)return null;
 return Number(m[1].replace(/[ .]/g,'').replace(',','.'));
}

function pick(o,keys){for(const k of Object.keys(o)){if(keys.includes(normKey(k)))return o[k]}return null}
function num(v){if(typeof v==='number')return v;let x=String(v??'').trim().replace(/\s/g,'').replace('%','').replace(',','.');let n=Number(x);return Number.isFinite(n)?n:null}
async function importXTB(inp){
 const f=inp.files?.[0]; if(!f)return;
 try{
  const buf=await f.arrayBuffer(); const wb=XLSX.read(buf,{type:'array',cellDates:true});
  let rows=[];
  for(const sn of wb.SheetNames){const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:null}); if(a.length>rows.length)rows=a}
  if(!rows.length)throw new Error('Soubor neobsahuje tabulková data.');
  const aliases={
   ticker:['symbol','ticker','instrumentticker','instrument','symbolcode'],
   name:['name','instrumentname','nazev','description'],
   qty:['quantity','qty','volume','shares','ks','position'],
   value:['marketvalue','marketvalueczk','hodnotak','valueczk','positionvalue','currentvalue'],
   pl:['pl','pnl','profitloss','unrealizedpl','ziskztrata','plpercent','plpct'],
   plczk:['plczk','pnlczk','profitlossczk','unrealizedplczk'],
   price:['price','currentprice','marketprice'],
   fx:['fx','fxczk','exchangerate']
  };
  const intel=new Map(base.xtb.positions.map(x=>[x.ticker,x]));
  let ps=[];
  for(const r of rows){
    let ticker=pick(r,aliases.ticker), name=pick(r,aliases.name);
    if(!ticker)continue; ticker=String(ticker).trim();
    let value=num(pick(r,aliases.value)), qty=num(pick(r,aliases.qty)), price=num(pick(r,aliases.price)), fx=num(pick(r,aliases.fx));
    if(value==null && qty!=null && price!=null)value=qty*price*(fx||1);
    if(value==null || value<=0)continue;
    let rawpl=num(pick(r,aliases.pl)), plczk=num(pick(r,aliases.plczk)), pl=rawpl;
    if(pl!=null && Math.abs(pl)>2)pl/=100;
    const old=intel.get(ticker)||{};
    ps.push({name:String(name||old.name||ticker),ticker,type:old.type||'—',value,weight:0,pl:pl??old.pl??0,plczk:plczk??old.plczk??0,verdict:old.verdict||'—',confidence:old.confidence??null});
  }
  const dedup=new Map(); for(const p of ps)dedup.set(p.ticker,p); ps=[...dedup.values()];
  if(ps.length<3)throw new Error('Nepodařilo se rozpoznat pozice. Export musí obsahovat alespoň ticker/symbol a hodnotu pozice.');
  const total=ps.reduce((a,x)=>a+x.value,0); ps.forEach(x=>x.weight=x.value/total);
  s.xtb={...s.xtb,value:total,positions:ps,asOf:new Date().toISOString(),source:'Import '+f.name,marketEstimate:null};
  save(); setTimeout(()=>{const m=document.getElementById('xtbmsg');if(m)m.textContent=`Import OK: ${ps.length} pozic · ${cz(total)}`},0)
 }catch(e){const m=document.getElementById('xtbmsg'); if(m)m.textContent='Import selhal: '+e.message}
 finally{inp.value=''}
}

function postSaleRows(){
 const m=s.tradeJournal.market?.prices||{};
 return (s.tradeJournal.trades||[]).filter(x=>x.kind==='INVESTMENT').map(x=>{
   const q=m[x.ticker]; let hypothetical=null,opportunity=null,movePct=null;
   if(q?.price&&q?.fx&&x.avgClose){
     hypothetical=x.volume*q.price*q.fx;
     opportunity=hypothetical-x.saleValue;
     movePct=q.price/x.avgClose-1;
   }
   const threshold=Math.max(500,(x.saleValue||0)*0.02);
   let verdict='ČEKÁ NA LIVE CENU',grade='muted';
   if(opportunity!=null){
     if(opportunity<=-threshold){
       verdict=x.realized<0?'ZACHRÁNĚNÁ ZTRÁTA':'PRODÁNO DOBŘE';grade='green';
     }else if(opportunity>=threshold){
       verdict=x.realized<0?'ZTRÁTA + NÁSLEDNÝ RŮST':'PRODÁNO BRZO';grade='red';
     }else{
       verdict='NEUTRÁLNÍ EXIT';grade='muted';
     }
   }
   return {...x,q,hypothetical,opportunity,movePct,threshold,verdict,grade};
 });
}
function postSaleStats(){
 const rows=postSaleRows(),live=rows.filter(x=>x.opportunity!=null);
 const opportunity=live.reduce((a,x)=>a+x.opportunity,0);
 const realized=rows.reduce((a,x)=>a+(x.realized||0),0);
 const good=live.filter(x=>x.opportunity<=-x.threshold);
 const early=live.filter(x=>x.opportunity>=x.threshold);
 const saved=good.reduce((a,x)=>a+Math.max(0,-x.opportunity),0);
 const missed=early.reduce((a,x)=>a+Math.max(0,x.opportunity),0);
 const best=[...live].sort((a,b)=>a.opportunity-b.opportunity)[0]||null;
 const worst=[...live].sort((a,b)=>b.opportunity-a.opportunity)[0]||null;
 return {rows,live,opportunity,realized,good,early,saved,missed,best,worst};
}

function lessonsLearned(){
 const x=postSaleStats(), rows=x.live;
 const winners=rows.filter(r=>(r.realized||0)>0);
 const losers=rows.filter(r=>(r.realized||0)<0);
 const winnerEarly=winners.filter(r=>r.opportunity>=r.threshold);
 const winnerGood=winners.filter(r=>r.opportunity<=-r.threshold);
 const loserBounce=losers.filter(r=>r.opportunity>=r.threshold);
 const loserSaved=losers.filter(r=>r.opportunity<=-r.threshold);
 const avg=(a,fn)=>a.length?a.reduce((s,r)=>s+fn(r),0)/a.length:0;
 const avgWinnerPost=avg(winners,r=>r.movePct||0), avgLoserPost=avg(losers,r=>r.movePct||0);
 const patterns=[];
 if(winnerEarly.length>=2 || (winners.length>=3&&winnerEarly.length/winners.length>=0.4))patterns.push({severity:'amber',title:'Vítěze možná prodáváš příliš brzo',detail:`${winnerEarly.length}/${winners.length} ziskových exitů pokračovalo výrazně nahoru po prodeji.`});
 if(loserBounce.length>=2 || (losers.length>=3&&loserBounce.length/losers.length>=0.4))patterns.push({severity:'amber',title:'Část ztrát realizuješ před odrazem',detail:`${loserBounce.length}/${losers.length} ztrátových exitů se po prodeji výrazně zotavilo.`});
 if(loserSaved.length>=2)patterns.push({severity:'green',title:'Umíš utnout část špatných pozic včas',detail:`${loserSaved.length} ztrátových exitů po prodeji dál klesalo.`});
 if(winnerGood.length>=2)patterns.push({severity:'green',title:'Umíš zamknout zisk před poklesem',detail:`${winnerGood.length} ziskových exitů po prodeji výrazně oslabilo.`});
 if(!patterns.length&&rows.length)patterns.push({severity:'green',title:'Zatím bez silného behaviorálního vzorce',detail:'Historie exitů zatím neukazuje jednoznačnou opakovanou chybu.'});
 const rules=[];
 if(winnerEarly.length>=2)rules.push('U ziskové pozice před úplným prodejem zvaž částečný exit místo 100% prodeje.');
 if(loserBounce.length>=2)rules.push('U ztrátové pozice před prodejem ověř, zda se změnila investiční teze, ne jen cena.');
 if(loserSaved.length>=2)rules.push('U porušené investiční teze pokračuj v rychlém řezu ztráty.');
 if(!rules.length)rules.push('Sbírej další exity; behavior engine se zpřesní s historií.');
 return {rows,winners,losers,winnerEarly,winnerGood,loserBounce,loserSaved,avgWinnerPost,avgLoserPost,patterns,rules};
}

}
function simulatorScore(s){

function buildMonthlyPlan(){
 const amount=safeInvestAmount();

 if(!amount||!x.rows.length)return {amount,alloc:[],reason:'Není dostupná bezpečná investovatelná částka.'};

 // Exclude positions that are already concentrated or flagged for reduction.
 const eligible=x.rows.filter(p=>p.weight<0.12 && p.signal!=='ZVÁŽIT REDUKCI');
 if(!eligible.length)return {amount,alloc:[],reason:'Všechny pozice jsou aktuálně nad limitem nebo vyžadují kontrolu.'};

 // Score favors low weight / diversification, penalizes large recent jumps and deep unresolved losses.
 const scored=eligible.map(p=>{
   let score=(0.12-p.weight)*100;
   if(p.weight<0.06)score+=4;
   if(p.move!=null&&p.move>0.05)score-=5;
   if(p.net_profit_pct<-10)score-=3;
   if(/VWCE|EUNA|IUSN|IS3N|EXUS|XDWH/i.test(p.ticker))score+=2;
   return {...p,planScore:Math.max(0.1,score)};
 }).sort((a,b)=>b.planScore-a.planScore);

 const picks=scored.slice(0,3);
 const totalScore=picks.reduce((a,p)=>a+p.planScore,0);
 let alloc=picks.map(p=>({...p,amount:Math.round(amount*(p.planScore/totalScore)/500)*500}));
 // Make exact total by adjusting largest allocation.
 let diff=amount-alloc.reduce((a,p)=>a+p.amount,0);
 if(alloc.length)alloc[0].amount+=diff;

}

function dayStart(d=new Date()){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function daysBetween(a,b){return Math.floor((dayStart(a)-dayStart(b))/86400000)}


function priorityScoreItem(x){
 const now=new Date(), today=dayStart(now);
 let score=0,reasons=[];
 const add=(pts,why)=>{score+=pts;reasons.push(why)};
 const title=String(x.title||'');
 const area=String(x.area||'');
 if(x.kind==='task'){
   if(x.due){
     const dd=daysBetween(new Date(x.due),today);
     if(dd<=0)add(35,'termín dnes / po termínu');
     else if(dd===1)add(25,'termín zítra');
     else if(dd<=3)add(15,'termín do 3 dnů');
   }
   const p=String(x.priority||'').toUpperCase();
   if(p==='HIGH'||Number(x.priority)>=90)add(35,'vysoká ruční priorita');
   else if(p==='NORMAL')add(12,'běžná priorita');
   if(x.status==='ČEKÁM'){add(8,'čeká na externí krok');if(x.due)add(8,'čekání má termín');}
   if(/faktur|platb|peněz|pokut|smlouv|termín|doklad|občank|řidič/i.test(title))add(18,'administrativní / finanční dopad');
 }
 if(x.kind==='routine'){
   const diff=daysBetween(x.d,today);
   if(diff<=0)add(40,'termín dnes / po termínu');
   else if(diff===1)add(30,'termín zítra');
   else if(diff<=3)add(18,'termín do 3 dnů');
 }
 if(x.kind==='delegation'){
   if(x.overdue)add(38,'kontrola delegace po termínu');

 }
 if(x.kind==='calendar'){
   const st=new Date(x.start),mins=(st-now)/60000;
   if(mins>=0&&mins<=120)add(30,'schůzka do 2 hodin');

 }
 if(x.kind==='investment'){

   else if(x.reviewPriority==='VYSOKÁ')add(10,'vysoká investiční revize');
 }
 if(/Nová Zbrojovka|fakturace|docházka|cesták|karta zakázky/i.test(title))add(10,'pracovní provoz / deadline');
 if(area==='Práce')add(5,'pracovní dopad');
 return {score:Math.min(100,Math.round(score)),reasons};
}
function autoPriorityItems(){
 const now=new Date(),today=dayStart(now),items=[];
 for(const t of (s.tasks||[])){
   if(t.status==='HOTOVO')continue;
   items.push({kind:'task',title:t.title,area:t.area||'Úkoly',priority:t.priority,status:t.status,due:t.due});
 }
 for(const r of (s.routines||[])){
   const d=due(r);if(s.routineDone?.[key(r,d)])continue;
   const diff=daysBetween(d,today);if(diff>=0&&diff<=7)items.push({kind:'routine',title:r.title,area:r.area||'Rutiny',d});
 }
 try{
   for(const d of delegationState()){
     if(d.status==='DONE')continue;
     items.push({kind:'delegation',title:d.title,area:'Delegace',owner:d.owner,nudges:d.lastNudgeAt?1:0,overdue:!!(d.followUpAt&&new Date(d.followUpAt)<now)});
   }
 }catch{}
 for(const e of (s.calendar?.events||[])){
   const st=new Date(e.start),diff=daysBetween(st,today);if(diff>=0&&diff<=1)items.push({kind:'calendar',title:e.title,area:'Kalendář',start:e.start,busy:e.busy});
 }
 try{
   for(const p of financeCalendar().slice(0,10))items.push({kind:'finance',title:p.title,area:'Finance',start:p.start,amount:p.amount});
 }catch{}
 try{
   for(const q of thesisReviewQueue().slice(0,8))items.push({kind:'investment',title:q.ticker+' · revize teze',area:'Investice',reviewScore:q.reviewScore,reviewPriority:q.reviewPriority});
 }catch{}
 return items.map(x=>({...x,...priorityScoreItem(x)})).sort((a,b)=>b.score-a.score);
}

function parseQuickCapture(text){
 const raw=String(text||'').trim();
 const low=raw.toLowerCase();
 let kind='task',owner='',title=raw,due=null,priority='NORMAL';
 if(/urgent|urgovat|urgence|follow.?up/.test(low))kind='delegation';
 else if(/delegovat|předat/.test(low))kind='delegation';
 else if(/poznámk|note/.test(low))kind='note';
 else if(/invest|xtb|akci|etf/.test(low))kind='investment-note';
 if(/dnes/.test(low))due=new Date();
 else if(/zítra/.test(low)){due=new Date();due.setDate(due.getDate()+1)}
 else if(/high|vysoká priorita|kritick/.test(low))priority='HIGH';
 const m=raw.match(/(?:komu|pro|delegovat)\s+([A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][\wÁ-ž-]+)/i);
 if(m)owner=m[1];
 title=raw.replace(/^(úkol|task|poznámka|note|delegovat|předat|urgovat|urgence|follow[- ]?up)\s*[:\-]?\s*/i,'').trim();
 return {kind,title,owner,due,priority,raw};
}

function waitingForItems(){
 const now=Date.now(), rows=[];
 // Tasks explicitly waiting
 for(const t of (s.tasks||[])){
   if(t.status!=='ČEKÁM')continue;
   const since=t.updatedAt||t.createdAt||null;
   const days=since?Math.floor((now-new Date(since))/86400000):null;
   rows.push({id:'task|'+(t.id||t.title),kind:'task',title:t.title,owner:t.owner||'',since,days,followUpAt:t.followUpAt||null,source:t});
 }
 // Delegations
 try{
   for(const d of delegationState()){
     if(d.status==='DONE')continue;
     const since=d.createdAt||null;
     const days=since?Math.floor((now-new Date(since))/86400000):null;
     rows.push({id:'del|'+d.id,kind:'delegation',title:d.title,owner:d.owner||'',since,days,followUpAt:d.followUpAt||null,source:d});
   }
 }catch{}
 return rows.sort((a,b)=>{
   const ao=a.followUpAt?new Date(a.followUpAt).getTime():Infinity;
   const bo=b.followUpAt?new Date(b.followUpAt).getTime():Infinity;
   return ao-bo;
 });
}
function waitingUrgency(x){
 const now=Date.now(); let score=0,reasons=[];
 if(x.followUpAt){
   const diff=(new Date(x.followUpAt).getTime()-now)/86400000;
   if(diff<0){score+=50;reasons.push('follow-up po termínu')}
   else if(diff<=1){score+=30;reasons.push('follow-up do 24 h')}
   else if(diff<=3){score+=15;reasons.push('follow-up do 3 dnů')}
 }
 if(x.days!=null){
   if(x.days>=7){score+=30;reasons.push(`čeká ${x.days} dní`)}
   else if(x.days>=3){score+=15;reasons.push(`čeká ${x.days} dny`)}
 }
 if(!x.owner){score+=20;reasons.push('chybí vlastník')}
 return {score:Math.min(100,score),reasons};
}

function todaysBusyBlocks(){
 const now=new Date(),start=dayStart(now),end=new Date(start.getTime()+86400000);
 return (s.calendar?.events||[])
  .filter(e=>e.busy&&!e.allDay&&new Date(e.start)<end&&new Date(e.end)>start)
  .map(e=>({title:e.title,start:new Date(e.start),end:new Date(e.end)}))
  .sort((a,b)=>a.start-b.start);
}
function minutesBetween(a,b){return Math.max(0,Math.round((b-a)/60000))}
function mergeBusy(blocks){
 if(!blocks.length)return [];
 const out=[{...blocks[0]}];
 for(const b of blocks.slice(1)){
   const last=out[out.length-1];
   if(b.start<=last.end){if(b.end>last.end)last.end=b.end}
   else out.push({...b});
 }
 return out;
}
function workingWindow(){
 const now=new Date();
 const start=new Date(now);start.setHours(8,0,0,0);
 const end=new Date(now);end.setHours(17,0,0,0);
 return {start,end};
}
function freeWindows(){
 const w=workingWindow(),busy=mergeBusy(todaysBusyBlocks()
   .map(b=>({start:new Date(Math.max(b.start,w.start)),end:new Date(Math.min(b.end,w.end)),title:b.title}))
   .filter(b=>b.end>b.start));
 const out=[];let cur=new Date(w.start);
 for(const b of busy){
   if(b.start>cur)out.push({start:new Date(cur),end:new Date(b.start)});
   if(b.end>cur)cur=new Date(b.end);
 }
 if(cur<w.end)out.push({start:new Date(cur),end:new Date(w.end)});
 return out.filter(x=>minutesBetween(x.start,x.end)>=20);
}
function baseEstimateDuration(x){
 if(x.kind==='calendar')return 0;
 if(x.kind==='investment')return 20;
 if(x.kind==='delegation')return 10;
 if(x.kind==='finance')return 15;
 if(x.kind==='routine'){
   const t=(x.title||'').toLowerCase();
   if(/docház|cesták|faktur/.test(t))return 25;
   return 20;
 }
 const t=(x.title||'').toLowerCase();
 if(/email|mail|zavolat|telefon|urgovat/.test(t))return 10;
 if(/občank|řidič|úřad/.test(t))return 45;
 return x.score>=75?45:x.score>=50?30:20;
}
function estimateDuration(x){
 const base=baseEstimateDuration(x);
 return typeof learnedDuration==='function'?learnedDuration(base):base;
}
function buildDayPlan(){
 const now=new Date(),items=autoPriorityItems()
   .filter(x=>x.kind!=='calendar')
   .slice(0,10)
   .map(x=>({...x,duration:estimateDuration(x)}));
 const windows=freeWindows();
 const plan=[],unplanned=[];
 for(const item of items){
   let placed=false;
   for(const win of windows){
     const available=minutesBetween(win.start,win.end);
     if(available>=item.duration){
       const st=new Date(win.start),en=new Date(st.getTime()+item.duration*60000);
       plan.push({...item,start:st,end:en});
       win.start=new Date(en.getTime()+5*60000);
       placed=true;break;
     }
   }
   if(!placed)unplanned.push(item);
 }
 return {plan,unplanned,windows:freeWindows(),busy:todaysBusyBlocks(),now};
}

function capacitySummary(){
 const busy=todaysBusyBlocks(),free=freeWindows();
 const busyMin=busy.reduce((a,b)=>a+minutesBetween(b.start,b.end),0);
 const freeMin=free.reduce((a,b)=>a+minutesBetween(b.start,b.end),0);
 const planned=buildDayPlan();
 const workMin=planned.plan.reduce((a,x)=>a+x.duration,0);
 const demand=workMin+planned.unplanned.reduce((a,x)=>a+x.duration,0);
 const load=freeMin?Math.round(demand/freeMin*100):999;
 let state='V POHODĚ',severity='green';
 if(load>120){state='PŘETÍŽENO';severity='red'}
 else if(load>90){state='NA HRANĚ';severity='amber'}
 return {busyMin,freeMin,workMin,demand,load,state,severity,unplanned:planned.unplanned};
}

function executionLearning(){
 const log=executionLog().filter(x=>x.status==='DONE'&&x.planned>0&&x.actual>=0);
 const recent=log.slice(-50);
 const ratio=recent.length?recent.reduce((a,x)=>a+(x.actual/x.planned),0)/recent.length:1;
 const accuracy=recent.length?Math.max(0,Math.round(100-Math.abs(1-ratio)*100)):100;
 const byType={short:[],medium:[],long:[]};
 recent.forEach(x=>byType[x.planned<=15?'short':x.planned<=30?'medium':'long'].push(x.actual/x.planned));
 const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:1;
 return {count:recent.length,ratio,accuracy,multipliers:{short:avg(byType.short),medium:avg(byType.medium),long:avg(byType.long)}};
}
function learnedDuration(base){
 const l=executionLearning();
 const k=base<=15?l.multipliers.short:base<=30?l.multipliers.medium:l.multipliers.long;
 return Math.max(5,Math.round(base*k/5)*5);
}

function weekRange(offset=0){
 const d=new Date();d.setHours(0,0,0,0);
 const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+offset*7);
 const start=new Date(d),end=new Date(d);end.setDate(end.getDate()+7);
 return {start,end};
}
function weeklyOSData(){
 const {start,end}=weekRange(0),prev=weekRange(-1);
 const log=executionLog();
 const inRange=(x,r)=>new Date(x.at||x.date)>=r.start&&new Date(x.at||x.date)<r.end;
 const cur=log.filter(x=>inRange(x,{start,end})),old=log.filter(x=>inRange(x,prev));
 const done=cur.filter(x=>x.status==='DONE').length;
 const dropped=cur.filter(x=>x.status==='DROPPED').length;
 const planned=cur.reduce((a,x)=>a+(x.planned||0),0),actual=cur.reduce((a,x)=>a+(x.actual||0),0);
 const oldDone=old.filter(x=>x.status==='DONE').length;
 const waiting=waitingForItems();
 const overdue=waiting.filter(x=>waitingUrgency(x).score>=50);
 const inbox=normalizeInbox().filter(x=>x.status==='NEW');
 const q=typeof thesisReviewQueue==='function'?thesisReviewQueue():[];
 const criticalInvest=q.filter(x=>x.reviewPriority==='KRITICKÁ'||x.reviewPriority==='VYSOKÁ');
 const followups=followUpRadarItems();
 const score=Math.max(0,Math.min(100,
   70 + done*3 - dropped*4 - overdue.length*5 - inbox.length*2 - criticalInvest.length*3
 ));
 return {start,end,done,dropped,planned,actual,oldDone,waiting,overdue,inbox,criticalInvest,followups,score};
}

 if(week.overdue.length>=3)signals.push({type:'amber',title:'Follow-up disciplína potřebuje pozornost',detail:`${week.overdue.length} věcí je po termínu kontroly.`});
 if(week.inbox.length>=5)signals.push({type:'amber',title:'Inbox se plní rychleji než čistí',detail:`${week.inbox.length} nerozhodnutých položek.`});
 if(lessons?.winnerEarly?.length>=2)signals.push({type:'amber',title:'Investice: pozor na předčasný prodej vítězů',detail:`${lessons.winnerEarly.length} historických exitů pokračovalo nahoru.`});

 if(!signals.length)signals.push({type:'green',title:'Bez výrazného slabého vzorce',detail:'Systém zatím nevidí opakující se problém.'});

function dailyScoreData(){
 let score=100,issues=[];
 const inbox=(typeof normalizeInbox==='function'?normalizeInbox():[]).filter(x=>x.status==='NEW').length;
 const waiting=(typeof waitingForItems==='function'?waitingForItems():[]).filter(x=>waitingUrgency(x).score>=50).length;
 const fresh=typeof dataFreshnessScore==='function'?dataFreshnessScore():{score:100};
 const cap=typeof capacitySummary==='function'?capacitySummary():{load:0};
 const inv=typeof thesisReviewQueue==='function'?thesisReviewQueue().filter(x=>x.reviewPriority==='KRITICKÁ'||x.reviewPriority==='VYSOKÁ').length:0;
 if(inbox){score-=Math.min(15,inbox*3);issues.push(`${inbox} v inboxu`)}
 if(waiting){score-=Math.min(20,waiting*5);issues.push(`${waiting} follow-up po termínu`)}
 if(fresh.score<85){score-=Math.round((85-fresh.score)*.35);issues.push('stará data')}
 if(cap.load>100){score-=Math.min(20,Math.round((cap.load-100)*.3));issues.push('přetížený den')}
 if(inv){score-=Math.min(15,inv*4);issues.push(`${inv} investiční revize`)}
 try{const rr=riskRadarData().filter(x=>x.score>=75).length;if(rr){score-=Math.min(15,rr*3);issues.push(`${rr} kritická rizika`)}}catch{}
 score=Math.max(0,Math.min(100,Math.round(score)));
 let state=score>=85?'VÝBORNĚ':score>=70?'DOBŘE':score>=50?'POZOR':'KRITICKÉ';
 return {score,state,issues,inbox,waiting,fresh,cap,inv};
}

function contextSwitchData(){
 const plan=buildDayPlan().plan;
 const groups=[];
 let prev=null,switches=0;
 for(const x of plan){
   const area=x.area||x.kind||'Jiné';
   if(prev&&prev!==area)switches++;
   if(!groups.length||groups[groups.length-1].area!==area)groups.push({area,items:[x],minutes:x.duration});
   else{groups[groups.length-1].items.push(x);groups[groups.length-1].minutes+=x.duration}
   prev=area;
 }
 const penalty=Math.max(0,switches-3)*8;
 const score=Math.max(0,100-penalty);
 return {groups,switches,score};
}

function slaRules(){

  delegation:{warnDays:2,escalateDays:4,criticalDays:7},

function slaFor(x){
 const r=slaRules()[x.kind==='delegation'?'delegation':'waiting'];
 const days=x.days??0;
 let level='OK',score=0,action='ČEKAT';
 if(days>=r.criticalDays){level='KRITICKÉ';score=100;action='ESKALOVAT / UZAVŘÍT'}
 else if(days>=r.escalateDays){level='ESKALOVAT';score=75;action='URGOVAT DNES'}
 else if(days>=r.warnDays){level='POZOR';score=45;action='FOLLOW-UP'}
 return {level,score,action};
}

function projectHealthRows(){

   if(!ops[p.id])ops[p.id]={lastReviewed:null,blocked:false,note:''};
   const o=ops[p.id];
   const reasons=[];let score=100;
   if(!p.next||String(p.next).trim().length<3){score-=30;reasons.push('chybí next action')}
   if(/ček/i.test(p.status||'')){score-=15;reasons.push('projekt čeká')}
   if(o.blocked){score-=35;reasons.push('ručně označen jako blokovaný')}

     const age=Math.floor((now-new Date(o.lastReviewed))/86400000);
     if(age>=30){score-=25;reasons.push(`revize stará ${age} dní`)}
     else if(age>=14){score-=12;reasons.push(`revize stará ${age} dní`)}

   const linked=(s.tasks||[]).filter(t=>t.status!=='HOTOVO'&&(
     String(t.projectId||'')===String(p.id)||

function hygieneData(){
 const issues=[];let score=100;
 const active=(s.tasks||[]).filter(x=>x.status!=='HOTOVO');
 const seen=new Map();
 for(const t of active){
   const k=String(t.title||'').trim().toLowerCase();if(!k)continue;
   seen.set(k,(seen.get(k)||0)+1);
 }
 const dup=[...seen].filter(x=>x[1]>1);
 if(dup.length){score-=Math.min(20,dup.length*5);issues.push(`${dup.length} možné duplicity úkolů`)}
 try{
   const orphan=waitingForItems().filter(x=>!x.owner&&x.kind==='delegation').length;
   if(orphan){score-=Math.min(20,orphan*5);issues.push(`${orphan} delegací bez vlastníka`)}
 }catch{}
 const noNext=(s.projects||[]).filter(p=>!p.next||String(p.next).trim().length<3).length;
 if(noNext){score-=Math.min(20,noNext*6);issues.push(`${noNext} projektů bez next action`)}
 try{
   const f=dataFreshnessScore();if(f.score<85){score-=10;issues.push('některá data jsou stará')}
 }catch{}
 try{
   const over=s.routines.filter(r=>days(due(r))<0).length;
   if(over){score-=Math.min(25,over*8);issues.push(`${over} rutin po termínu`)}
 }catch{}
 score=Math.max(0,score);
 return {score,issues,dup};
}

function forecast7Data(){
 const out=[];
 const base=new Date();base.setHours(0,0,0,0);
 for(let k=0;k<7;k++){
   const d=new Date(base);d.setDate(d.getDate()+k);
   const d2=new Date(d);d2.setDate(d2.getDate()+1);
   let busy=0;
   for(const e of (s.calendar?.events||[])){
     const st=new Date(e.start),en=new Date(e.end);
     if(e.busy&&!e.allDay&&st<d2&&en>d){
       busy+=Math.max(0,(Math.min(en,d2)-Math.max(st,d))/3600000);
     }
   }
   let routine=0;
   for(const r of (s.routines||[])){try{const rd=due(r);if(rd.toDateString()===d.toDateString())routine++}catch{}}
   let task=0;
   for(const t of (s.tasks||[])){
     if(t.status==='HOTOVO'||!t.due)continue;
     const td=new Date(t.due);if(td.toDateString()===d.toDateString())task++;
   }
   const pressure=Math.min(100,Math.round(busy/9*60+routine*15+task*10));
   out.push({date:d,busy,routine,task,pressure});
 }
 return out;
}

     seen.add(x.id);
   }
 };
 ids(s.tasks,'Úkoly');ids(s.projects,'Projekty');ids(s.delegations,'Delegace');
 for(const t of s.tasks||[]){
   if(t.due && isNaN(new Date(t.due)))issues.push({level:'WARN',title:`Úkol má neplatný termín: ${t.title}`});
 }
 for(const d of s.delegations||[]){
   if(d.followUpAt && isNaN(new Date(d.followUpAt)))issues.push({level:'WARN',title:`Delegace má neplatný follow-up: ${d.title}`});
 }
 for(const p of s.projects||[]){
   if(!p.name)issues.push({level:'WARN',title:'Projekt bez názvu'});
 }
 try{
   const raw=JSON.stringify(s);
   if(raw.length>4_000_000)issues.push({level:'WARN',title:'Local state je velmi velký (>4 MB)'});
 }catch{issues.push({level:'CRITICAL',title:'State nejde serializovat'})}
 return issues;

 const openHours=lastOpen?(now-lastOpen)/3600000:null;

 const staleOpen=openHours!=null&&openHours>36;
 const staleSync=syncHours==null||syncHours>24;

function focusQueueData(){
 const now=new Date();
 const source=autoPriorityItems().filter(x=>x.kind!=='calendar');
 const out=[];
 for(const x of source){
   let penalty=0,bonus=0,reasons=[];
   if(x.kind==='delegation'){penalty+=15;reasons.push('čeká na jiného')}
   if(x.kind==='task'&&x.status==='ČEKÁM'){penalty+=20;reasons.push('blokováno')}
   if(x.kind==='investment'){penalty+=5;reasons.push('review, ne deep work')}
   if(x.score>=75){bonus+=15;reasons.push('vysoký dopad')}
   const duration=estimateDuration(x);
   if(duration>=40){bonus+=8;reasons.push('deep work')}
   if(duration<=15){penalty+=5;reasons.push('rychlovka')}
   const focusScore=Math.max(0,Math.min(100,x.score+bonus-penalty));
   out.push({...x,duration,focusScore,reasons});
 }
 return out.sort((a,b)=>b.focusScore-a.focusScore);
}

 </div>`;

function rebalanceData(){
 const c=capacitySummary(),plan=buildDayPlan(),items=plan.plan.map(x=>({...x,focus:focusQueueData().find(y=>y.title===x.title)?.focusScore||x.score}));
 const keep=[],move=[],delegate=[];
 if(c.load<=95)return {state:'V POHODĚ',keep:items,move,delegate,need:0,load:c.load};
 let excess=Math.max(0,c.demand-c.freeMin);
 const sorted=[...items].sort((a,b)=>a.focus-b.focus);
 for(const x of sorted){
   if(excess<=0){keep.push(x);continue}
   if(x.kind==='delegation'||/email|mail|zavolat|urgov/i.test(x.title||'')){delegate.push(x);excess-=x.duration}
   else{move.push(x);excess-=x.duration}
 }
 return {state:c.load>120?'PŘETÍŽENO':'NA HRANĚ',keep,move,delegate,need:Math.max(0,excess),load:c.load};
}

function taskAgeRows(){

   return {...t,age,touched,decay,stale};

function signalPool(){
 const a=[];
 const add=(key,title,score,source,detail,action)=>a.push({key,title,score,source,detail,action});
 try{for(const x of autoPriorityItems().slice(0,20))add('work|'+x.title,x.title,x.score||0,'Priority',x.area||x.kind,null)}catch{}
 try{for(const x of riskRadarData())add('risk|'+x.title,x.title,x.score||0,'Risk',x.detail||x.area,null)}catch{}
 try{for(const x of watchdogData())add('watch|'+x.title,x.title,x.severity||0,'Watchdog',x.detail,null)}catch{}
 try{for(const x of actionInboxItems())add('action|'+x.title,x.title,x.score||0,'Action Inbox',x.detail,x.type)}catch{}
 try{for(const x of evaluateRules())add('rule|'+x.title,x.title,72,'Rule Engine',x.rule,x.action)}catch{}
 try{for(const x of ticketRiskSignals())add('ticket|'+x.title,x.title,x.score,'Vstupenky',x.detail,x.status)}catch{}
 return a;

function mergedSignals(){
 const map=new Map();
 for(const x of signalPool()){
   const norm=(x.title||'').toLowerCase().replace(/\s+/g,' ').trim();
   if(!norm)continue;
   if(!map.has(norm))map.set(norm,{title:x.title,score:x.score,sources:[x.source],details:[x.detail],actions:x.action?[x.action]:[]});
   else{
     const y=map.get(norm);y.score=Math.max(y.score,x.score)+Math.min(12,4*y.sources.length);
     if(!y.sources.includes(x.source))y.sources.push(x.source);
     if(x.detail&&!y.details.includes(x.detail))y.details.push(x.detail);
     if(x.action&&!y.actions.includes(x.action))y.actions.push(x.action);
   }
 }
 return [...map.values()].map(x=>({...x,score:Math.min(100,Math.round(x.score)),confidence:Math.min(99,55+x.sources.length*11+(x.score>=80?8:0))})).sort((a,b)=>b.score-a.score);
}

function autoStateTransitions(){
 const changes=[];
 for(const t of (s.tasks||[])){
   if(t.status==='HOTOVO')continue;
   if(t.due&&new Date(t.due)<new Date()&&t.status==='UDĚLAT'){
     changes.push({type:'task-overdue',title:t.title,apply:()=>{t.priority='HIGH';t.updatedAt=new Date().toISOString()}});
   }
 }
 try{
   for(const d of delegationState()){
     if(d.status==='DONE')continue;
     if(d.followUpAt&&new Date(d.followUpAt)<new Date()&&d.status==='WAITING'){
       changes.push({type:'delegation-overdue',title:d.title,apply:()=>{d.status='NUDGE';d.lastNudgeAt=new Date().toISOString()}});
     }
   }
 }catch{}
 return changes;
}

function daysToEvent(dt){return Math.ceil((new Date(dt+'T12:00:00')-new Date())/86400000)}

 const d=daysToEvent(x.date);
 let status='HOLD',severity='green',score=40;
 if(d<=7){status='SELL / DROP PRICE';severity='red';score=95}
 else if(d<=14){status='SELL';severity='amber';score=80}
 else if(d<=30){status='MONITOR';severity='amber';score=65}
 return {d,status,severity,score};
}

function ensureTicketWorkflow(){
 const store=ticketStore();
 for(const x of store.items){
   if(!x.id)x.id='ticket|'+Math.random().toString(36).slice(2);
   if(!x.workflow)x.workflow=x.sell>0?'SOLD':'HOLD';
   if(!x.platform)x.platform='';
   if(x.listPrice==null)x.listPrice=0;
   if(x.fees==null)x.fees=0;
   if(!x.payoutStatus)x.payoutStatus=x.sell>0?'WAIT':'N/A';
   if(!x.transferStatus)x.transferStatus='UNKNOWN';
   if(!('soldAt' in x))x.soldAt=null;
   if(!('payoutAt' in x))x.payoutAt=null;
 }
 return store.items;
}
function ticketNetProfit(x){
 const revenue=Number(x.sell||0);
 return revenue-Number(x.buy||0)-Number(x.fees||0);
}
function setTicketWorkflow(id,status){

 x.workflow=status;

function ensureDebtWorkflow(){
 const d=debtStore();
 for(const x of d.items){
   if(!x.id)x.id='debt|'+Math.random().toString(36).slice(2);
   if(!x.createdAt)x.createdAt=new Date().toISOString();
   if(!Array.isArray(x.payments))x.payments=[];
   if(!('promisedAt' in x))x.promisedAt=null;
   if(!('lastContactAt' in x))x.lastContactAt=null;
 }
 return d.items;
}
function debtPaid(x){return (x.payments||[]).reduce((a,p)=>a+Number(p.amount||0),0)}
function debtRemaining(x){return Math.max(0,Number(x.amount||0)-debtPaid(x))}
function debtSignal(x){
 const now=Date.now(),prom=x.promisedAt?new Date(x.promisedAt).getTime():null,last=x.lastContactAt?new Date(x.lastContactAt).getTime():null;
 if(prom&&prom<now)return {state:'PO TERMÍNU',severity:'red'};
 if(!last)return {state:'URGOVAT',severity:'amber'};
 const days=Math.floor((now-last)/86400000);
 if(days>=14)return {state:'URGOVAT',severity:'red'};
 if(days>=7)return {state:'FOLLOW-UP',severity:'amber'};
 return {state:'ČEKAT',severity:'green'};
}
function debtPayment(id){
 const x=ensureDebtWorkflow().find(x=>x.id===id);if(!x)return;
 const amount=Number(prompt('Výše splátky:',debtRemaining(x))||0);if(amount<=0)return;
 x.payments.push({amount,at:new Date().toISOString()});x.lastContactAt=new Date().toISOString();
 if(debtRemaining(x)<=0){x.status='PAID';x.paidAt=new Date().toISOString()}
 markLocalWrite();localStorage.setItem('kamil-os-state',JSON.stringify(s));cloudSave();render();
}
function debtFollowup(id){
 const x=ensureDebtWorkflow().find(x=>x.id===id);if(!x)return;
 x.lastContactAt=new Date().toISOString();
 const d=new Date();d.setDate(d.getDate()+7);x.promisedAt=d.toISOString();
 markLocalWrite();localStorage.setItem('kamil-os-state',JSON.stringify(s));cloudSave();render();
}

 const d=debtStore(),confirmed=ensureDebtWorkflow().filter(x=>x.status==='OPEN'||x.status==='PARTIAL');
 const total=confirmed.reduce((n,x)=>n+debtRemaining(x),0);
 const by={};for(const x of confirmed)by[x.person]=(by[x.person]||0)+debtRemaining(x);
 const urgent=confirmed.filter(x=>['URGOVAT','PO TERMÍNU','FOLLOW-UP'].includes(debtSignal(x).state));
 return {d,confirmed,total,by,review:d.review,urgent};
}

function dataQuality(){

 let ticketScore=100,debtScore=100;
 for(const x of tickets){
   if(!x.platform){ticketScore-=3;issues.push(`Ticket bez platformy: ${x.name}`)}

 }
 for(const x of debts){
   if(!x.promisedAt){debtScore-=3}

 }
 ticketScore=Math.max(20,ticketScore);debtScore=Math.max(20,debtScore);

   const p=prev.tickets.find(y=>y.id===x.id);if(!p){out.push({type:'good',title:'Nová ticket pozice',detail:x.name});continue}
   if(p.workflow!==x.workflow)out.push({type:'good',title:x.name,detail:`${p.workflow} → ${x.workflow}`});
   if(Number(p.listPrice||0)!==Number(x.listPrice||0))out.push({type:'warn',title:x.name,detail:`listing ${cz(p.listPrice||0)} → ${cz(x.listPrice||0)}`});
 }
 for(const x of now.debts){
   const p=prev.debts.find(y=>y.id===x.id);if(!p){out.push({type:'warn',title:'Nový dluh',detail:`${x.person} · ${cz(x.remaining)}`});continue}
   if(x.remaining<p.remaining)out.push({type:'good',title:`Dluh ${x.person}`,detail:`−${cz(p.remaining-x.remaining)}`});
   if(x.status!==p.status)out.push({type:'good',title:`Dluh ${x.person}`,detail:`${p.status} → ${x.status}`});
 }
 return out.slice(0,15);
}

function morningCandidates(){
 const now=new Date(), today=dayStart(now), out=[];

 // 1) Calendar: timed meetings today/tomorrow and all-day deadlines
 for(const e of (s.calendar?.events||[])){
   const st=new Date(e.start), diff=daysBetween(st,today);
   if(diff<0||diff>2)continue;
   const timed=!e.allDay;
   let score=0,why='';
   if(diff===0&&timed){score=95;why='dnes v '+st.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'})}
   else if(diff===0){score=88;why='termín dnes'}
   else if(diff===1){score=74;why='zítra'}
   else {score=56;why='za 2 dny'}
   if(e.busy)score+=4;
   out.push({area:'Kalendář',title:e.title,score,why,when:st,kind:'calendar'});
 }

 // 2) Tasks / waiting items
 for(const t of (s.tasks||[])){
   if(t.status==='HOTOVO')continue;
   let score=55,why=t.status||'úkol';
   if(t.priority==='HIGH'||t.priority==='VYSOKÁ')score+=25;
   if(t.status==='UDĚLAT')score+=10;
   if(/ček|odpově|waiting/i.test(t.status||''))score-=10;
   if(/faktur|termín|smlouv|zakáz|platb|pojišt|doklad|řidič|občan/i.test(t.title||''))score+=12;
   out.push({area:'Úkoly',title:t.title,score,why,kind:'task'});
 }

 // 3) Monthly routines
 for(const r of (s.routines||[])){
   try{
     const d=due(r), delta=Math.round((d-today)/86400000);
     if(delta>7)continue;
     const done=s.routineDone?.[key(r,d)];
     if(done)continue;
     let score=delta<0?96:delta===0?94:delta<=2?82:66;
     out.push({area:'Řízení',title:r.title||r.name,score,why:delta<0?`po termínu ${Math.abs(delta)} d`:delta===0?'dnes':`za ${delta} d`,kind:'routine'});
   }catch{}
 }

 // 4) Upcoming money outflows
 try{
   for(const e of financeCalendar()){
     const st=new Date(e.start), delta=daysBetween(st,today);
     if(delta>7)continue;
     const amount=e.amount||0;
     let score=delta===0?90:delta<=2?78:64;
     if(amount>=10000)score+=8;
     if(amount>=30000)score+=5;
     out.push({area:'Finance',title:e.title,score,why:`${delta===0?'dnes':delta===1?'zítra':'za '+delta+' d'} · ${cz(amount)}`,kind:'finance'});
   }
 }catch{}


 // 5) Delegated items needing ownership / follow-up
 try{
   out.push(...delegationCandidatesForMorning());
 }catch{}

 // 6) Investment actions only if there is something actually actionable
 try{
   const cc=commandCenterData();
   if(cc.total>cc.completed){
     out.push({area:'Investice',title:`Dokončit měsíční investiční plán`,score:58,why:`zbývá ${cc.total-cc.completed} nákupů · ${cz(cc.pendingAmount)}`,kind:'invest'});
   }
   if(cc.reviews.length){
     const r=cc.reviews[0];
     out.push({area:'Investice',title:`Review ${r.entry.ticker} · ${r.milestone.label}`,score:52+Math.min(20,Math.max(0,r.milestone.overdue)),why:`checkpoint čeká`,kind:'review'});
   }
 }catch{}

 return out.sort((a,b)=>b.score-a.score);
}
function morningTop3(){

   try{
     const st=executionStatus(x);
     return st!=='DONE'&&st!=='TOMORROW';
   }catch{return true}

   if(chosen.length>=3)break;
   const duplicate=chosen.some(y=>y.title===x.title);

   // Prefer diversity unless urgency is extreme.
   if(usedKinds.has(x.kind)&&x.score<90&&all.some(y=>!usedKinds.has(y.kind)&&y.score>=x.score-12))continue;

 }

}

function delegationOwnerStats(){
 const arr=delegationState();
 const by={};
 for(const x of arr){
   const owner=(x.owner||'Bez vlastníka').trim()||'Bez vlastníka';
   if(!by[owner])by[owner]={owner,total:0,done:0,lateDone:0,nudges:0,onTime:0,open:0};
   const o=by[owner];o.total++;
   if(x.lastNudgeAt)o.nudges++;
   if(x.status==='DONE'){
     o.done++;
     const late=x.followUpAt&&x.doneAt&&new Date(x.doneAt)>new Date(x.followUpAt);
     if(late)o.lateDone++; else o.onTime++;
   } else o.open++;
 }
 return Object.values(by).map(o=>{
   const completed=Math.max(1,o.done);
   const reliability=Math.max(0,Math.min(100,Math.round(
     (o.onTime/completed)*70 +
     ((o.done-o.lateDone)/completed)*20 -
     Math.min(20,o.nudges*4) +
     (o.done?10:0)
   )));
   return {...o,reliability};
 }).sort((a,b)=>b.reliability-a.reliability);
}
function delegationCycleDays(x){
 if(!x.createdAt||!x.doneAt)return null;
 return Math.max(0,(new Date(x.doneAt)-new Date(x.createdAt))/86400000);
}
