<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1118">
<title>Kamil OS 22.3.4</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="updateBanner" class="update-banner hidden">
  <span>Je dostupná nová verze Kamil OS.</span>
  <button class="btn primary" id="reloadAppBtn">Aktualizovat</button>
</div>

<div id="authView" class="auth-shell">
  <div class="auth-card">
    <div class="eyebrow">KAMIL OS 22.3.4</div>
    <h1>Přihlášení</h1>
    <p class="muted">Tvoje data jsou uložená v privátním cloudovém účtu. Registrace nových účtů tady není zapnutá.</p>
    <label>E-mail<input id="loginEmail" type="email" autocomplete="username"></label>
    <label>Heslo<input id="loginPassword" type="password" autocomplete="current-password"></label>
    <button class="btn primary wide" id="loginBtn">Přihlásit</button>
    <div id="authMessage" class="muted"></div>
  </div>
</div>

<div id="appView" class="app hidden">
  <header class="topbar">
    <div>
      <div class="brand">Kamil OS <span class="version">22.3.4</span></div>
      <div class="sub" id="todayLabel"></div>
    </div>
    <div class="top-actions">
      <span id="syncStatus" class="sync ok">Uloženo</span>
      <button class="icon-btn" id="undoBtn" title="Vrátit poslední akci">↶</button>
    </div>
  </header>

  <nav id="mainNav" class="main-nav" aria-label="Hlavní navigace">
    <button data-view="today" class="on">Dnes</button>
    <button data-view="work">Práce</button>
    <button data-view="money">Peníze</button>
    <button data-view="tickets">Vstupenky</button>
    <button data-view="more">Více <span id="moreBadge" class="badge hidden"></span></button>
  </nav>

  <div class="command-wrap">
    <input id="commandInput" class="command-input" placeholder="Přidej úkol, hledej nebo napiš příkaz…  Ctrl/Cmd + K">
    <button class="btn" id="commandGo">Provést</button>
    <div id="commandResults" class="command-results hidden"></div>
  </div>

  <main>
    <section id="view-today" class="view on">
      <div id="todayView"></div>
    </section>

    <section id="view-work" class="view">
      <div id="workView"></div>
    </section>

    <section id="view-money" class="view">
      <div id="moneyView"></div>
    </section>

    <section id="view-tickets" class="view">
      <div id="ticketsView"></div>
    </section>

    <section id="view-more" class="view">
      <div id="moreView"></div>
    </section>
  </main>

  <nav id="bottomNav" class="bottom-nav" aria-label="Mobilní navigace">
    <button data-view="today" class="on">Dnes</button>
    <button data-view="work">Práce</button>
    <button data-view="money">Peníze</button>
    <button data-view="tickets">Vstupenky</button>
    <button data-view="more">Více</button>
  </nav>
</div>

<div id="modalHost"></div>
<div id="toastHost"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
