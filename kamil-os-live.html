async function importXTB(inp){
 const f=inp.files?.[0]; if(!f)return;
 try{
  const buf=await f.arrayBuffer(); const wb=XLSX.read(buf,{type:'array',cellDates:true});
  let rows=[];
  for(const sn of wb.SheetNames){const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:null}); if(a.length>rows.length)rows=a}
  if(!rows.length)throw new Error('Soubor neobsahuje tabulková data.');
  const aliases={
   ticker:['symbol','ticker','instrumentticker','instrument','symbolcode'],
   name:['name','instrumentname','nazev','description'],
   qty:['quantity','qty','volume','shares','ks','position'],
   value:['marketvalue','marketvalueczk','hodnotak','valueczk','positionvalue','currentvalue'],
   pl:['pl','pnl','profitloss','unrealizedpl','ziskztrata','plpercent','plpct'],
   plczk:['plczk','pnlczk','profitlossczk','unrealizedplczk'],
   price:['price','currentprice','marketprice'],
   fx:['fx','fxczk','exchangerate']
  };
  const intel=new Map(base.xtb.positions.map(x=>[x.ticker,x]));
  let ps=[];
  for(const r of rows){
    let ticker=pick(r,aliases.ticker), name=pick(r,aliases.name);
    if(!ticker)continue; ticker=String(ticker).trim();
    let value=num(pick(r,aliases.value)), qty=num(pick(r,aliases.qty)), price=num(pick(r,aliases.price)), fx=num(pick(r,aliases.fx));
    if(value==null && qty!=null && price!=null)value=qty*price*(fx||1);
    if(value==null || value<=0)continue;
    let rawpl=num(pick(r,aliases.pl)), plczk=num(pick(r,aliases.plczk)), pl=rawpl;
    if(pl!=null && Math.abs(pl)>2)pl/=100;
    const old=intel.get(ticker)||{};
    ps.push({name:String(name||old.name||ticker),ticker,type:old.type||'—',value,weight:0,pl:pl??old.pl??0,plczk:plczk??old.plczk??0,verdict:old.verdict||'—',confidence:old.confidence??null});
  }
  const dedup=new Map(); for(const p of ps)dedup.set(p.ticker,p); ps=[...dedup.values()];
  if(ps.length<3)throw new Error('Nepodařilo se rozpoznat pozice. Export musí obsahovat alespoň ticker/symbol a hodnotu pozice.');
  const total=ps.reduce((a,x)=>a+x.value,0); ps.forEach(x=>x.weight=x.value/total);
  s.xtb={...s.xtb,value:total,positions:ps,asOf:new Date().toISOString(),source:'Import '+f.name,marketEstimate:null};
  save(); setTimeout(()=>{const m=document.getElementById('xtbmsg');if(m)m.textContent=`Import OK: ${ps.length} pozic · ${cz(total)}`},0)
 }catch(e){const m=document.getElementById('xtbmsg'); if(m)m.textContent='Import selhal: '+e.message}
 finally{inp.value=''}
}

function dayStart(d=new Date()){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function daysBetween(a,b){return Math.floor((dayStart(a)-dayStart(b))/86400000)}
function morningCandidates(){
 const now=new Date(), today=dayStart(now), out=[];

 // 1) Calendar: timed meetings today/tomorrow and all-day deadlines
 for(const e of (s.calendar?.events||[])){
   const st=new Date(e.start), diff=daysBetween(st,today);
   if(diff<0||diff>2)continue;
   const timed=!e.allDay;
   let score=0,why='';
   if(diff===0&&timed){score=95;why='dnes v '+st.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'})}
   else if(diff===0){score=88;why='termín dnes'}
   else if(diff===1){score=74;why='zítra'}
   else {score=56;why='za 2 dny'}
   if(e.busy)score+=4;
   out.push({area:'Kalendář',title:e.title,score,why,when:st,kind:'calendar'});
 }

 // 2) Tasks / waiting items
 for(const t of (s.tasks||[])){
   if(t.status==='HOTOVO')continue;
   let score=55,why=t.status||'úkol';
   if(t.priority==='HIGH'||t.priority==='VYSOKÁ')score+=25;
   if(t.status==='UDĚLAT')score+=10;
   if(/ček|odpově|waiting/i.test(t.status||''))score-=10;
   if(/faktur|termín|smlouv|zakáz|platb|pojišt|doklad|řidič|občan/i.test(t.title||''))score+=12;
   out.push({area:'Úkoly',title:t.title,score,why,kind:'task'});
 }

 // 3) Monthly routines

        <button class="btn ${x.status==='WAITING'?'primary':''}" onclick="updateDelegation('${x.id}','status','WAITING')">Čekám</button>
        <button class="btn ${overdue||x.status==='NUDGE'?'primary':''}" onclick="updateDelegation('${x.id}','status','NUDGE')">Urgovat</button>
        <button class="btn" onclick="snoozeDelegation('${x.id}',2)">+2 dny</button>
        <button class="btn ${x.status==='DONE'?'primary':''}" onclick="updateDelegation('${x.id}','status','DONE')">Hotovo</button>
      </div>
   </div>`}).join('')||'<p class="muted">V týdenním plánu zatím není nic označeno jako DELEGOVAT.</p>'}
   </div>
 </div>`;
}
setTimeout(renderDelegationCenter,0);
</script><script>
function delegationOwnerStats(){
 const arr=delegationState();
 const by={};
 for(const x of arr){
   const owner=(x.owner||'Bez vlastníka').trim()||'Bez vlastníka';
   if(!by[owner])by[owner]={owner,total:0,done:0,lateDone:0,nudges:0,onTime:0,open:0};
   const o=by[owner];o.total++;
   if(x.lastNudgeAt)o.nudges++;
   if(x.status==='DONE'){
     o.done++;
     const late=x.followUpAt&&x.doneAt&&new Date(x.doneAt)>new Date(x.followUpAt);
     if(late)o.lateDone++; else o.onTime++;
   } else o.open++;
 }
 return Object.values(by).map(o=>{
   const completed=Math.max(1,o.done);
   const reliability=Math.max(0,Math.min(100,Math.round(
     (o.onTime/completed)*70 +
     ((o.done-o.lateDone)/completed)*20 -
     Math.min(20,o.nudges*4) +
     (o.done?10:0)
   )));
   return {...o,reliability};
 }).sort((a,b)=>b.reliability-a.reliability);
}
function delegationCycleDays(x){
 if(!x.createdAt||!x.doneAt)return null;
 return Math.max(0,(new Date(x.doneAt)-new Date(x.createdAt))/86400000);
}
function saveDelegationResult(id,value){
 const x=delegationState().find(d=>d.id===id);if(!x)return;
 x.result=value;
 localStorage.setItem('kamil-os-state',JSON.stringify(s));cloudSave();
 renderDelegationCenter();renderDelegationAccountability();
}
function renderDelegationAccountability(){
 const box=document.getElementById('delegation');if(!box)return;
 let acc=document.getElementById('delegationaccountability');
 if(!acc){
   acc=document.createElement('div');
   acc.id='delegationaccountability';
   acc.className='grid';
   acc.style.marginTop='12px';
   box.appendChild(acc);
 }
 const stats=delegationOwnerStats();
 const done=delegationState().filter(x=>x.status==='DONE').slice().sort((a,b)=>new Date(b.doneAt)-new Date(a.doneAt)).slice(0,12);
 acc.innerHTML=`<div class="card full"><h2>Accountability podle vlastníka</h2>
   <div class="muted">Orientační skóre podle dokončení včas a počtu urgencí. Má pomoct řízení, ne hodnotit lidi bez kontextu.</div>
   <div style="overflow:auto;margin-top:10px"><table><tr><th>Vlastník</th><th>Úkolů</th><th>Hotovo</th><th>Včas</th><th>Urgence</th><th>Otevřeno</th><th>Spolehlivost</th></tr>
   ${stats.map(x=>`<tr><td><b>${x.owner}</b></td><td>${x.total}</td><td>${x.done}</td><td>${x.onTime}</td><td>${x.nudges}</td><td>${x.open}</td><td class="${x.reliability>=80?'green':x.reliability>=60?'amber':'red'}"><b>${x.reliability}%</b></td></tr>`).join('')||'<tr><td colspan="7">Zatím není dost delegačních dat.</td></tr>'}
   </table></div>
 </div>
 <div class="card full"><h2>Dokončené delegace</h2>
   ${done.map(x=>`<div class="row">
      <div><b>${x.title}</b><div class="muted">${x.owner||'Bez vlastníka'} · ${delegationCycleDays(x)==null?'—':delegationCycleDays(x).toFixed(1)+' d'} · hotovo ${new Date(x.doneAt).toLocaleDateString('cs-CZ')}</div></div>
      <input style="min-width:260px" placeholder="výsledek / poznámka" value="${x.result||''}" onchange="saveDelegationResult('${x.id}',this.value)">
   </div>`).join('')||'<p class="muted">Zatím žádná dokončená delegace.</p>'}
 </div>`;
}
setTimeout(()=>{renderDelegationCenter();renderDelegationAccountability()},0);
</script><script>

</script><script>
async function runCloudHealth(){
 const host=document.getElementById('cloudhealth'); if(!host)return;
 host.innerHTML='<div class="muted">Kontroluji cloud…</div>';
 const checks=[];
 const push=(name,ok,detail)=>checks.push({name,ok,detail});
 try{
   const {data:{session},error}=await sb.auth.getSession();
   push('Session',!!session&&!error,error?.message||session?.user?.email||'bez session');
   if(session?.user){
     const state=await sb.from('kamil_os_state').select('updated_at').eq('user_id',session.user.id).maybeSingle();
     push('Cloud state',!state.error,state.error?.message||(state.data?'dostupný':'zatím prázdný'));
     const xtb=await sb.from('kamil_xtb_data').select('as_of').eq('id',1).maybeSingle();
     push('XTB Data Hub',!xtb.error,xtb.error?.message||(xtb.data?.as_of?'as of '+new Date(xtb.data.as_of).toLocaleString('cs-CZ'):'bez dat'));
     const cal=await sb.from('kamil_calendar_cache').select('as_of').eq('id',1).maybeSingle();
     push('Kalendář cache',!cal.error,cal.error?.message||(cal.data?.as_of?'as of '+new Date(cal.data.as_of).toLocaleString('cs-CZ'):'bez dat'));
     try{
       const {data,error}=await sb.functions.invoke('market-refresh',{body:{tickers:['VWCE.DE']}});
       push('Market refresh',!error&&!!data,error?.message||'edge function odpovídá');
     }catch(e){push('Market refresh',false,e.message||String(e))}
   }else{
     push('Cloud state',false,'vyžaduje login');
     push('XTB Data Hub',false,'vyžaduje login');
     push('Kalendář cache',false,'vyžaduje login');
     push('Market refresh',false,'vyžaduje login');
   }
 }catch(e){
   push('Supabase klient',false,e.message||String(e));
 }
 const ok=checks.filter(x=>x.ok).length;
 host.innerHTML=`<div class="grid">
   <div class="card"><div class="muted">Cloud Health</div><div class="kpi ${ok===checks.length?'green':ok?'amber':'red'}">${ok}/${checks.length}</div></div>
   <div class="card"><div class="muted">Stav</div><div class="title">${ok===checks.length?'Vše OK':ok?'Částečně funkční':'Cloud nedostupný'}</div></div>
 </div>
 <div style="margin-top:10px">${checks.map(c=>`<div class="row"><div><b>${c.name}</b><div class="muted">${c.detail||''}</div></div><span class="${c.ok?'green':'red'}">${c.ok?'OK':'CHYBA'}</span></div>`).join('')}</div>`;
}
async function repairSession(){
 authMsg('Obnovuji session…');
 try{
   const {data,error}=await sb.auth.refreshSession();
   if(error)throw error;
   if(data?.session){
     updateAuthUI(data.session);
     authMsg('Session obnovena.','green');
     await loadCalendarCache();await loadXtbHub();render();setTimeout(runCloudHealth,0);
   }else authMsg('Session nelze obnovit. Pošli jeden nový magic link.','amber');
 }catch(e){
   authMsg('Obnova session selhala: '+(e.message||e),'red');
 }
}
function mountCloudHealth(){
 const cloudv=document.getElementById('cloudv'); if(!cloudv)return;
 let box=document.getElementById('cloudhealthwrap');
 if(!box){
   box=document.createElement('div');box.id='cloudhealthwrap';box.className='card full';box.style.marginTop='12px';
   box.innerHTML=`<h2>Cloud Health & Recovery</h2>
   <div class="form"><button class="btn primary" onclick="runCloudHealth()">Spustit diagnostiku</button><button class="btn" onclick="repairSession()">Obnovit session</button></div>
   <div id="cloudhealth" style="margin-top:10px"></div>`;
   cloudv.appendChild(box);
 }
 setTimeout(runCloudHealth,50);
}
setTimeout(mountCloudHealth,0);
</script></body></html>
